<title>箱庭の村</title>
<style>
/* Layout: full-bleed canvas diorama; top HUD (clock, language, phrasebook, god's voice, villagers), bottom-left log/cards, bottom-right camera controls, side phrasebook */
:root{
  --ink:#4a3f5c;
  --ink-soft:#7a6d8f;
  --panel:rgba(255,253,250,.84);
  --line:rgba(120,100,160,.22);
  --accent:#e0786c;
  --gold:#c8902e;
  --en:#3f7fa8;
  --sky:#cfd9f0;
  --font:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--sky);color:var(--ink);font-family:var(--font);overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
.hud{position:fixed;z-index:2}
.panel{background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px}
.top{top:calc(env(safe-area-inset-top,0px) + 10px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.row1{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;pointer-events:none}
.row1>*{pointer-events:auto}
.clock{padding:6px 14px 7px;display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.clock .day{font-size:12px;color:var(--ink-soft);letter-spacing:.04em}
.clock b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock .period{font-size:13px;font-weight:700;color:var(--accent)}
.clock .wx{font-size:12px;color:var(--ink-soft)}
.pill{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:transparent}
.pill.lang{color:#fff;background:var(--en);border-color:transparent}
.pill .n{display:inline-block;min-width:1.4em;margin-left:4px;padding:0 5px;border-radius:8px;background:rgba(63,127,168,.15);color:var(--en);font-variant-numeric:tabular-nums}
.god{flex:1 1 300px;min-width:0;display:flex;align-items:center;gap:6px;padding:5px 5px 5px 12px}
.god label{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.06em;white-space:nowrap}
.god input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--ink);background:transparent;border:0;outline:0;padding:6px 2px}
.god input::placeholder{color:#a397b4}
.god button{font:inherit;font-size:13px;font-weight:700;color:#fff;background:var(--gold);border:0;border-radius:10px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.god button:disabled{opacity:.55;cursor:default}
.god:focus-within{box-shadow:0 0 0 2px rgba(200,144,46,.35)}
#roster{list-style:none;margin:0;padding:0 0 2px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;pointer-events:auto;align-self:flex-start;max-width:100%}
#roster::-webkit-scrollbar{display:none}
#roster button{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 5px;font:inherit;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;white-space:nowrap}
#roster button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px rgba(224,120,108,.25)}
.dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.hint{margin:0;font-size:11px;color:var(--ink-soft);pointer-events:none;align-self:flex-start;background:var(--panel);border-radius:8px;padding:2px 8px}
.log{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(440px,calc(100% - 340px));min-width:240px;padding:7px 12px;margin:0;list-style:none;font-size:12px;line-height:1.5;display:flex;flex-direction:column;gap:2px}
.log li{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log time{color:var(--ink-soft);font-variant-numeric:tabular-nums;margin-right:6px}
.log .sub{color:var(--ink-soft);margin-left:6px;font-size:11px}
.log .god-line{color:var(--gold);font-weight:700}
.sheet{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(350px,calc(100% - 32px));padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;max-height:calc(100% - 200px);overflow:auto}
@media (max-width:640px){
  .log{width:auto;right:max(16px,env(safe-area-inset-right,0px));min-width:0;bottom:calc(env(safe-area-inset-bottom,0px) + 58px)}
  .sheet{bottom:calc(env(safe-area-inset-bottom,0px) + 58px)}
}
.sheet header{display:flex;align-items:center;gap:8px}
.sheet h2{margin:0;font-size:17px}
.sheet .mood{font-size:12px;color:var(--ink-soft)}
.x{margin-left:auto;font:inherit;font-size:18px;line-height:1;color:var(--ink-soft);background:none;border:0;cursor:pointer;padding:4px 6px}
.persona{margin:0;font-size:12px;color:var(--ink-soft);line-height:1.5}
.status{margin:0;font-size:14px;font-weight:700;display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap}
.status .ja,.ja-sub{font-size:12px;font-weight:500;color:var(--ink-soft);display:block;width:100%}
.needs{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 8px;align-items:center;font-size:11px}
.bar{height:7px;border-radius:4px;background:rgba(120,100,160,.14);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{font:inherit;font-size:12px;font-weight:700;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer}
.acts button[aria-pressed="true"]{background:var(--ink);color:#fff}
.say-btn{font:inherit;font-size:12px;line-height:1;color:var(--en);background:rgba(63,127,168,.1);border:0;border-radius:8px;padding:5px 7px;cursor:pointer;flex:none}
.thought{margin:0;font-size:13px;line-height:1.6;background:rgba(200,144,46,.1);border-radius:10px;padding:8px 10px}
.word h2{font-size:22px;color:var(--en)}
.word .ex{margin:0;font-size:14px;line-height:1.55;font-weight:700}
.word .exja{margin:0;font-size:12px;color:var(--ink-soft)}
.book{top:calc(env(safe-area-inset-top,0px) + 10px);right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(360px,calc(100% - 32px));padding:12px 14px;display:flex;flex-direction:column;gap:8px;z-index:4}
.townbtns{display:flex;gap:6px;flex-wrap:wrap}
.apibox{display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:1px solid var(--line)}
.apibox h3{margin:0;font-size:14px}
#apiForm{display:flex;gap:6px;flex-wrap:wrap}
#apiForm input,#apiForm select{font:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-width:0}
#apiForm input{flex:1 1 10em}
#apiForm button:disabled{opacity:.5;cursor:default}
.persona.wish{color:var(--gold);font-weight:700}
.book header{display:flex;align-items:center;gap:8px}
.book h2{margin:0;font-size:16px}
.book p{margin:0;font-size:12px;color:var(--ink-soft);line-height:1.5}
.book ul{list-style:none;margin:0;padding:0;overflow:auto;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
.book li{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;background:#fff;border:1px solid var(--line);border-radius:10px}
.book li div{flex:1;min-width:0}
.book li b{display:block;font-size:13px;line-height:1.45}
.book li span{display:block;font-size:11px;color:var(--ink-soft);line-height:1.45}
.controls{bottom:calc(env(safe-area-inset-bottom,0px) + 12px);right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.controls button{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;min-width:38px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#fpv{position:fixed;inset:0;z-index:1;background:#000}
#fpv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fpvCanvas{touch-action:none;cursor:grab}
#fpvOverlay{pointer-events:none}
body.fpv .log,body.fpv .controls,body.fpv .hint,body.fpv #card{display:none!important}
.acts button.play{background:var(--en);color:#fff;border-color:transparent}
.fpvhud{z-index:3;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(640px,calc(100% - 32px));padding:10px 12px;display:flex;flex-direction:column;gap:8px}
body.coarse .fpvhud{left:auto;right:max(16px,env(safe-area-inset-right,0px));transform:none;width:calc(100% - 184px)}
.fpvtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.fneeds{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.mini{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--ink-soft)}
.mini em{font-style:normal}
.mini .bar{width:30px;height:6px}
.fsub{margin:0;font-size:15px;line-height:1.45}
.fsub b{display:block}
.fsub span{display:block;font-size:12px;color:var(--ink-soft)}
.facts{display:flex;gap:6px;flex-wrap:wrap}
.facts:empty{display:none}
.facts button{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.facts button.main{background:var(--en);color:#fff;border-color:transparent}
.facts button.on{background:var(--ink);color:#fff;border-color:transparent}
kbd{font:inherit;font-size:10px;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.14)}
.fctl{display:flex;gap:6px;align-items:center}
.fhint{flex:1;min-width:0;font-size:11px;color:var(--ink-soft)}
.fctl button{font:inherit;font-size:12px;font-weight:700;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.joy{display:none;position:fixed;z-index:3;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.6);touch-action:none}
body.fpv.coarse .joy{display:block}
.joy span{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.85);transform:translate(-50%,-50%);pointer-events:none}
.talk{z-index:3;top:calc(env(safe-area-inset-top,0px) + 118px);right:max(16px,env(safe-area-inset-right,0px));width:min(380px,calc(100% - 32px));max-height:calc(100% - 330px);min-height:220px;padding:12px;display:flex;flex-direction:column;gap:8px}
.talk header{display:flex;align-items:center;gap:8px}.talk h2{margin:0;font-size:16px}
#tList{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
#tList li{max-width:88%;padding:7px 10px;border-radius:12px;font-size:13px;line-height:1.45;background:#fff;border:1px solid var(--line);align-self:flex-start}
#tList li.me{align-self:flex-end;background:rgba(63,127,168,.12);border-color:transparent}
#tList li b{display:block;font-weight:700}
#tList li span{display:block;font-size:11px;color:var(--ink-soft)}
#tList .tip{margin-top:4px;font-size:11px;color:var(--gold);font-weight:700}
#tList .say-btn{margin-top:4px}
.chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.chips button{font:inherit;font-size:11px;white-space:nowrap;color:var(--en);background:rgba(63,127,168,.1);border:0;border-radius:999px;padding:5px 9px;cursor:pointer}
#tForm{display:flex;gap:6px}
#tForm input{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
#tForm button{font:inherit;font-size:13px;font-weight:700;color:#fff;background:var(--en);border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
.toast{position:fixed;z-index:6;left:50%;top:42%;transform:translate(-50%,-50%);background:rgba(40,34,56,.86);color:#fff;font-size:13px;padding:8px 14px;border-radius:10px;pointer-events:none}
.word{z-index:4}
@media (max-width:640px){
  /* ボタンが増えても1列に収め、はみ出す分は横にスクロール */
  .controls{left:max(16px,env(safe-area-inset-left,0px));flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none}
  .controls::-webkit-scrollbar{display:none}
  .controls button{flex:none;white-space:nowrap;padding:8px 10px}
}
</style>


<canvas id="scene" aria-label="住人たちが暮らす小さな箱庭の村"></canvas>
<div class="hud top" id="hudTop">
  <div class="row1">
    <div class="clock panel"><span class="day" id="day">1日目</span><b id="time">07:00</b><span class="period" id="period">朝</span><span class="wx" id="wx">晴れ</span></div>
    <button class="pill lang" id="langBtn" type="button">English</button>
    <button class="pill" id="labelBtn" type="button" aria-pressed="false" hidden>Labels: Off</button>
    <button class="pill" id="townBtn" type="button">町</button>
    <button class="pill" id="bookBtn" type="button"><span id="bookLbl">フレーズ帳</span><span class="n" id="bookN">0</span></button>
    <form class="god panel" id="godForm" autocomplete="off">
      <label for="godInput" id="godLbl">神の声</label>
      <input id="godInput" maxlength="140" placeholder="例：今日はお祭りだ！みんな広場に集まれ">
      <button id="godSend" type="submit">告げる</button>
    </form>
  </div>
  <ul id="roster"></ul>
  <p class="hint" id="hint">ドラッグで回転・ホイールで拡大・住人や物をタップ</p>
</div>
<ul class="hud log panel" id="log"></ul>
<section class="hud sheet panel" id="card" hidden>
  <header><span class="dot" id="cDot"></span><h2 id="cName"></h2><span class="mood" id="cMood"></span><button class="x" id="cClose" type="button" aria-label="閉じる">×</button></header>
  <p class="persona" id="cPersona"></p>
  <p class="persona wish" id="cWish" hidden></p>
  <p class="status"><span id="cStatus"></span><button class="say-btn" id="cSay" type="button" aria-label="Listen">🔊</button><span class="ja" id="cStatusJa"></span></p>
  <div class="needs" id="cNeeds"></div>
  <div class="acts"><button id="cThink" type="button">心の声を聞く</button><button id="cFollow" type="button" aria-pressed="false">この人を追う</button><button id="cPlay" class="play" type="button">この人になる（一人称）</button></div>
  <p class="thought" id="cThought" hidden></p>
</section>
<section class="hud sheet panel word" id="wordCard" hidden>
  <header><h2 id="wWord"></h2><button class="say-btn" id="wSay" type="button" aria-label="Listen">🔊</button><button class="x" id="wClose" type="button" aria-label="閉じる">×</button></header>
  <p class="exja" id="wJa"></p>
  <p class="ex" id="wEx"></p>
  <p class="exja" id="wExJa"></p>
  <div class="acts"><button id="wExSay" type="button">🔊 例文を聞く</button></div>
</section>
<section class="hud book panel" id="town" hidden>
  <header><h2 id="townTitle">町の保存と歩み</h2><button class="x" id="townClose" type="button" aria-label="閉じる">×</button></header>
  <p id="townNote"></p>
  <div class="townbtns"><button class="pill" id="townSave" type="button"></button><button class="pill" id="townReset" type="button"></button></div>
  <p id="townStamp"></p>
  <div class="apibox" id="apiBox" hidden>
    <h3 id="apiTitle">Claude API</h3>
    <p id="apiNote"></p>
    <form id="apiForm" autocomplete="off">
      <input id="apiKey" type="password" autocomplete="off" spellcheck="false" aria-label="API key">
      <select id="apiModel" aria-label="Model"></select>
      <button class="pill" id="apiSave" type="submit"></button>
      <button class="pill" id="apiClear" type="button"></button>
    </form>
    <p id="apiState"></p>
  </div>
  <ul id="townList"></ul>
</section>
<section class="hud book panel" id="book" hidden>
  <header><h2 id="bookTitle">フレーズ帳</h2><button class="x" id="bookClose" type="button" aria-label="閉じる">×</button></header>
  <p id="bookNote">村で聞こえた英語のフレーズがたまっていきます。🔊で発音を聞けます。</p>
  <ul id="bookList"></ul>
</section>
<div class="hud controls" id="controls">
  <button id="zoomOut" type="button" aria-label="縮小">－</button>
  <button id="zoomIn" type="button" aria-label="拡大">＋</button>
  <button id="roofBtn" type="button">外観を見る</button>
  <button id="floorBtn" type="button" hidden>1階</button>
  <button id="speed" type="button">早送り ×1</button>
  <button id="reset" type="button">視点を戻す</button>
</div>

<div id="fpv" hidden><canvas id="fpvOverlay"></canvas></div>
<section class="hud fpvhud panel" id="fpvHud" hidden>
  <div class="fpvtop"><span class="dot" id="fpvDot"></span><b id="fpvName"></b><div class="fneeds" id="fpvNeeds"></div></div>
  <p class="fsub" id="fpvSub" hidden></p>
  <div class="facts" id="fpvActs"></div>
  <div class="fctl"><span class="fhint" id="fpvHint"></span><button id="fpvSpeed" type="button">×1</button><button id="fpvExit" type="button">戻る</button></div>
</section>
<div class="joy" id="joy"><span id="joyKnob"></span></div>
<section class="hud talk panel" id="talk" hidden>
  <header><span class="dot" id="tDot"></span><h2 id="tName"></h2><button class="x" id="tClose" type="button" aria-label="閉じる">×</button></header>
  <ul id="tList"></ul>
  <div class="chips" id="tChips"></div>
  <form id="tForm" autocomplete="off"><input id="tInput" maxlength="160" aria-label="message"><button id="tSend" type="submit">送る</button></form>
</section>
<div class="toast" id="toast" hidden></div>


<script>
(() => {
// ================= math =================
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ISO_AZ=Math.PI/4, ISO_EL=Math.asin(1/Math.sqrt(3));
const cross=(t,e)=>[t[1]*e[2]-t[2]*e[1],t[2]*e[0]-t[0]*e[2],t[0]*e[1]-t[1]*e[0]];
const dot=(t,e)=>t[0]*e[0]+t[1]*e[1]+t[2]*e[2];
const smooth=t=>{const e=clamp(t,0,1);return e*e*(3-2*e)};
const mix=(t,e,l)=>[lerp(t[0],e[0],l),lerp(t[1],e[1],l),lerp(t[2],e[2],l)];
const hash=t=>{const e=43758.5453*Math.sin(127.1*t+311.7);return e-Math.floor(e)};
const hx=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];
const rand=([a,b])=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const FONT='"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif';

// ================= language =================
let L='ja',showLabels=false;
try{showLabels=localStorage.getItem('hakoniwa-labels')==='1'}catch(e){}
try{const s=localStorage.getItem('hakoniwa-lang');if(s==='en'||s==='ja')L=s}catch(e){}
const tr=o=>o==null?'':typeof o==='string'?o:(o[L]??o.ja??o.en??'');
const J=(ja,en)=>({ja,en});
const UI={
  god:J('神の声','Voice of God'),send:J('告げる','Speak'),sending:J('届けています…','Sending…'),
  ph:J('例：今日はお祭りだ！みんな広場に集まれ','e.g. "It\'s festival day! Everyone, come to the plaza!"'),
  lang:J('English','日本語'),book:J('フレーズ帳','Phrasebook'),
  bookNote:J('村で聞こえた英語のフレーズがたまっていきます。🔊で発音を聞けます。','English phrases you hear in the village are saved here. Tap 🔊 to listen.'),
  bookEmpty:J('まだフレーズがありません。英語モードで住人の会話を聞いてみましょう。','No phrases yet. Watch the villagers in English mode.'),
  hint:J('ドラッグで回転・ホイールで拡大・住人や物をタップ','Drag to rotate · zoom in to see names · tap people and things to learn words'),

function polyFaces(shape,lo,hi,axis){

    else{F.push([[x1,y0,z0],[x1,y1,z0],[cx,y1,z1],[cx,y0,z1]],[[x0,y1,z0],[x0,y0,z0],[cx,y0,z1],[cx,y1,z1]],[[x0,y0,z0],[x1,y0,z0],[cx,y0,z1]],[[x1,y1,z0],[x0,y1,z0],[cx,y1,z1]])}
  }else{
    const n=12,rx=(x1-x0)/2,ry=(y1-y0)/2,ring=z=>Array.from({length:n},(_,i)=>{const a=i/n*Math.PI*2;return[cx+Math.cos(a)*rx,cy+Math.sin(a)*ry,z]});
    const b=ring(z0);

  }

const FURN_TYPES=Object.keys(FURN);
// ================= building builder =================
// 町の建物も、神の声で生まれる建物も、同じ「設計図（spec）」からここで組み立てる。
// 座標の決まり（spec 内）:
//  - マス番号（家具の at、部屋の from/to、ドアの at、階段の at）は 0 から数える整数。
//  - 連続座標（parts、仕切り壁、窓、床の模様、部屋ラベル）は敷地の左上角が 0、マスの境目が整数。
//  - 敷地 pos のマス (pos.x, pos.y) が、マス番号 (0,0) になる。
let bldSeq=1;
const SIDES=['px','py','nx','ny'];
const ROOF_SHAPES=['tiered','gable','flat','none'];
const FLOOR_STYLES=['wood','bedwood','tile','carpet','stone'];

// 床（スラブ）を、吹き抜けのマスを除いた長方形に分ける
function slabRects(w,d,holes){
  const out=[];let band=null;
  const rowSig=r=>{let s='';for(let c=0;c<w;c++)s+=holes.has(key(c,r))?'1':'0';return s};
  for(let r=0;r<=d;r++){const sig=r<d?rowSig(r):null;
    if(band&&sig===band.sig){band.r1=r;continue}
    if(band){let c=0;while(c<w){if(band.sig[c]==='1'){c++;continue}let e=c;while(e<w&&band.sig[e]==='0')e++;out.push({x0:c,y0:band.r0,x1:e,y1:band.r1+1});c=e}}
    band=sig==null?null:{sig,r0:r,r1:r}}
  return out;
}

function buildBuilding(spec,pos,o={}){
  const id=o.id||('b'+(bldSeq++));
  const[w,d]=spec.footprint,ox=pos.x-.5,oy=pos.y-.5,st=spec.style||{};
  const bld={id,spec,cx:pos.x,cy:pos.y,fixed:!!o.fixed,private:!!spec.private,enterable:!!spec.enterable,floors:spec.enterable?clamp(spec.floors||1,1,3):0,
    k:o.animate?0:1,boxes:[],polys:[],tiles:[],cells:[],vocab:[],acts:[],spots:{},floorTiles:[],blockedEdges:new Set(),door:null,residents:[],
    lights:false,glow:0,mealReady:0,mealName:null,dirty:false,cooking:null,tvOn:false,
    paper:col(st.paper,P.paper),curtain:col(st.curtain,[236,170,160]),rooms:[],roomCenters:{},extUses:[],pending:[]};
  buildings.push(bld);
  const B=(lo,hi,opt={})=>{const b=box(lo,hi,{...opt,bld});bld.boxes.push(b);return b};
  for(let x=0;x<w;x++)for(let y=0;y<d;y++)bld.cells.push([pos.x+x,pos.y+y]);
  // activities defined by this spec
  const actId={};
  (spec.activities||[]).forEach(a=>{const aid=(o.fixed?id+'.':'g_'+id+'_')+a.key;actId[a.key]=aid;
    ACTS[aid]={label:J(a.label_ja,a.label_en),use:J(a.use_ja||a.label_ja,a.use_en||a.label_en),glyph:a.glyph||'♪',dur:a.dur||[.6,1.3],gain:a.gain||{fun:.3},gen:true,
      created:o.fixed?null:clock.sim,hours:a.hours||null,who:a.who||'all',staff:!!a.staff,days:a.days||null,
      phrase:()=>a.phrase_en?J(a.phrase_ja||a.phrase_en,a.phrase_en):null};
    ACT_IDS.push(aid);bld.acts.push(aid)});
  const actOf=k=>actId[k]||(ACTS[k]&&!ACTS[k].home?k:null);
  if(spec.enterable)buildInterior(bld,spec,pos,B,actOf);
  // exterior parts (boxes and convex shapes)
  const topZ=bld.floors*WALL_H;
  for(const q of spec.parts||[]){
    const lo=[ox+q.from[0],oy+q.from[1],q.from[2]],hi=[ox+q.to[0],oy+q.to[1],q.to[2]],c=col(q.color,[230,200,180]),t=col(q.top,null);
    const ext=bld.enterable&&q.from[2]>=topZ-.01;
    if(q.shape==='box'||!q.shape){const deco={...(q.deco||{})};if(q.pattern&&q.pattern!=='none')['px','py','nx','ny'].forEach(k=>deco[k]='gen');if(q.topPattern&&q.topPattern!=='none')deco.top='genTop';
      B(lo,hi,{side:c,top:t||mix(c,[255,255,255],.15),deco,genSide:q.pattern,genTop:q.topPattern,exteriorOnly:ext})}
    else{const p={kind:'poly',faces:polyFaces(q.shape,lo,hi,q.axis),lo,hi,col:c,top:t||c,pattern:q.pattern,bld,exteriorOnly:ext};bld.polys.push(p);polys.push(p)}
  }
  // exterior uses: [{act, at:[[dx,dy],...]}]（敷地の外のマスも指定できる）
  for(const u of spec.uses||[]){const aid=u.spot||actOf(u.act);if(aid)bld.extUses.push({aid,cells:u.at.map(([dx,dy])=>[pos.x+dx,pos.y+dy])})}
  if(spec.activity&&!spec.activities){const a=spec.activity,aid='g_'+id;
    ACTS[aid]={label:J(a.label_ja,a.label_en),use:J(a.use_ja,a.use_en),glyph:'♪',dur:[.6,1.3],gain:a.gain,created:clock.sim,gen:true,phrase:()=>a.phrase_en?J(a.phrase_ja||a.phrase_en,a.phrase_en):null};
    ACT_IDS.push(aid);bld.acts.push(aid);bld.ringAct=aid}
  // name tag
  const top=Math.max(topZ+(bld.enterable?.6:0),...(spec.parts||[]).map(q=>q.to[2]));
  if(spec.name_en&&!o.noName){const la=spec.labelAt,v=vocab(spec.name_en,spec.name_ja,spec.example_en||`This is a ${spec.name_en}.`,spec.example_ja||`これは${spec.name_ja}です。`,la?[ox+la[0],oy+la[1],la[2]]:[pos.x+w/2-.5,pos.y+d/2-.5,top+.15],{sid:id,exterior:bld.enterable});bld.vocab.push(v)}
  return bld;
}

function buildInterior(bld,spec,pos,B,actOf){
  const[w,d]=spec.footprint,ox=pos.x-.5,oy=pos.y-.5,st=spec.style||{},H=WALL_H,F=bld.floors;
  const wallC=col(st.wall,P.wall),roofC=col(st.roof,P.coral);
  const solid=new Set(),voids=new Set(),uses=new Map();
  const ck=(c,r,lv)=>c+','+r+'@'+lv;
  // stairs: foot (c,r) on floor f, landing one step along dir on floor f+1
  const stairs=(spec.stairs||[]).map(s=>{const v=FACE_VEC[s.dir]||[1,0];return{...s,foot:s.at,land:[s.at[0]+v[0],s.at[1]+v[1]],v}});
  stairs.forEach(s=>{solid.add(ck(s.land[0],s.land[1],s.floor));voids.add(ck(s.foot[0],s.foot[1],s.floor+1))});
  const door=spec.door||{side:'py',at:1};
  for(let lv=0;lv<F;lv++){
    const zb=lv*H,holes=new Set(stairs.filter(s=>s.floor+1===lv).map(s=>key(...s.foot)));
    // floor slab
    for(const r of slabRects(w,d,holes))B([ox+r.x0,oy+r.y0,zb],[ox+r.x1,oy+r.y1,zb+FLOOR],{indoor:true,level:lv,top:P.floorW,side:mix(wallC,[150,120,110],.3),deco:{top:'floor'}});
    // outer walls (windows in continuous coords along each side)
    const wins=s=>{const a=spec.windows&&spec.windows[s];const len=s==='px'||s==='nx'?d:w;
      const list=Array.isArray(a)?a:Array.from({length:Math.max(0,Math.floor((len-.4)/2))},(_,i)=>len/2+(i-(Math.floor((len-.4)/2)-1)/2)*2);
      return list.map(v=>(s==='px'||s==='nx'?oy:ox)+v)};
    const wall=(lo,hi,n,ws,extra={})=>{const outer=n[0]>0?'px':n[0]<0?'nx':n[1]>0?'py':'ny',opp={px:'nx',nx:'px',py:'ny',ny:'py'};
      return B(lo,hi,{side:wallC,top:P.wallTrim,level:lv,cutN:n,wall:{wins:ws,outer,inner:opp[outer]},deco:{[outer]:'wallOut',[opp[outer]]:'wallIn'},...extra})};
    const z0=zb+FLOOR,z1=zb+H;
    const side=(s,lo,hi,n)=>{
      const along=s==='px'||s==='nx'?1:0,ws=wins(s);
      if(lv>0||door.side!==s){wall(lo,hi,n,ws);return}
      const a=(along?oy:ox)+door.at+.05,b=(along?oy:ox)+door.at+.95,seg=(p,q,zl,zh,wl)=>{const l=lo.slice(),h=hi.slice();l[along]=p;h[along]=q;l[2]=zl;h[2]=zh;wall(l,h,n,wl)};
      const inSeg=(p,q)=>ws.filter(v=>v>p+.4&&v<q-.4);
      seg(lo[along],a,z0,z1,inSeg(lo[along],a));seg(a,b,1.3,z1,[]);seg(b,hi[along],z0,z1,inSeg(b,hi[along]));
      const dl=lo.slice(),dh=hi.slice();dl[along]=a+.03;dh[along]=b-.03;const nn=along?0:1;
      if(n[nn]>0){dl[nn]=hi[nn]-.09;dh[nn]=hi[nn]-.03}else{dl[nn]=lo[nn]+.03;dh[nn]=lo[nn]+.09}
      dl[2]=FLOOR;dh[2]=1.3;B(dl,dh,{side:mix(col(st.door,P.coral),[120,70,90],.3),level:0,exteriorOnly:true,deco:{[s]:'doorleaf'}})};
    side('nx',[ox,oy,z0],[ox+.12,oy+d,z1],[-1,0,0]);
    side('px',[ox+w-.12,oy,z0],[ox+w,oy+d,z1],[1,0,0]);
    side('ny',[ox+.12,oy,z0],[ox+w-.12,oy+.12,z1],[0,-1,0]);
    side('py',[ox+.12,oy+d-.12,z0],[ox+w-.12,oy+d,z1],[0,1,0]);
    // partitions (low inner walls) and the edges they block
    const parts=(spec.partitions||[]).filter(p=>(p.floor||0)===lv);
    const hz=parts.filter(p=>typeof p.y==='number');
    for(const p of parts){
      if(typeof p.y==='number'){const x0=Math.max(.12,p.x[0]),x1=Math.min(w-.12,p.x[1]);B([ox+x0,oy+p.y-.06,z0],[ox+x1,oy+p.y+.06,zb+.6],{indoor:true,level:lv,side:bld.paper,top:P.wallTrim});
        for(let c=0;c<w;c++)if(c+.5>p.x[0]&&c+.5<p.x[1])blockEdge(bld,[pos.x+c,pos.y+p.y-1,lv],[pos.x+c,pos.y+p.y,lv])}
      else{const touch=y=>hz.some(h=>Math.abs(h.y-y)<1e-6&&h.x[0]<p.x&&h.x[1]>p.x);

  needs:{energy:.8,food:.35+.1*hash(i),social:.45+.3*hash(i+3),fun:.5+.3*hash(i+7),bladder:.35+.4*hash(i+11),hygiene:.55+.3*hash(i+13)},
  mood:null,moodUntil:0,say:null,forced:null,directive:null,memory:[],rel:{},chatT:0,turn:0,brushedAt:-99*HR,washedAt:-99*HR};h.residents.push(w);return w});
walkers.forEach(w=>PEOPLE.forEach(o=>{if(o.name!==w.name)w.rel[o.name]=(w.home===o.home?.55:.35)+.15*hash(w.name.length*7+o.name.length)}));
const cat={name:'タマ',en:'Tama',kind:'cat',tile:T(9,8),speed:1.9,cloak:[236,168,110],cap:[255,236,214],persona:J('村の猫。気まぐれ。','The village cat. Does whatever it likes.'),
  link:null,t:0,phase:2,wait:.5,path:[],goal:null,target:null,act:null,lastDir:[1,0],say:null,forced:null,memory:[],needs:null};

const people=walkers.filter(w=>w.kind==='person');
const byName=n=>walkers.find(w=>w.name===n||(w.en&&w.en.toLowerCase()===String(n).toLowerCase()));
const nameOf=w=>L==='en'?w.en:w.name;

function bfs(a,b){if(a===b)return[];const prev=new Map([[a,null]]),q=[a];while(q.length){const o=q.shift();if(o===b){const p=[];let c=b;while(c!==a){p.unshift(c);c=prev.get(c)}return p}if(o.stop&&o!==a)continue;for(const l of o.links)if(!prev.has(l.to)){prev.set(l.to,o);q.push(l.to)}}return null}
const directiveOn=w=>w.directive&&clock.sim<w.directive.until;
const sleepTime=w=>{const h=clock.hour;const s=h>=w.sleep||h<w.wake;return s&&!(directiveOn(w)&&w.directive.goal!=='sleep'&&w.directive.goal!=='home')};
const taken=w=>{const s=new Set();walkers.forEach(o=>{if(o===w)return;if(o.target)s.add(o.target);s.add(o.link?o.link.to:o.tile)});return s};
const remember=(w,txt)=>{if(!w.memory)return;w.memory.push(`${hhmm(clock.hour)} ${txt}`);if(w.memory.length>8)w.memory.shift()};
const say=(w,phrase,secs=4)=>{if(!phrase)return;w.say={...phrase,until:S.time+secs};addPhrase(phrase)};
// villagers who start the day still in bed
people.forEach(w=>{if(sleepTime(w)){w.tile=w.house.spots.sleep[w.bed];w.act={id:'sleep'};w.wait=(((w.wake-clock.hour)%24+24)%24)*HR;w.lastDir=[0,1]}});

// その行動ができる場所: 家の中の行動は自分の家の家具、それ以外は町中の場所（よその家の中は除く）
function spotsFor(w,id){
  const a=ACTS[id];if(!a)return[];
  if(a.home){const s=(w.house&&w.house.spots[id])||[];return id==='sleep'?[s[w.bed]]:s}
  if(id==='stall'&&w.keeper)return SPOTS.keeper||[];
  return(SPOTS[id]||[]).filter(t=>!t.bld||!t.bld.private||t.bld===w.house);
}
function planAct(w,id){
  const a=ACTS[id];if(!a)return null;
  const goal={id,dur:a.dur,run:a.run};
  const busy=taken(w);let target;
  if(a.random){const here=w.tile.pos,c=ground.filter(t=>!busy.has(t)&&Math.abs(t.pos[0]-here[0])+Math.abs(t.pos[1]-here[1])<(a.run?7:10));target=pick(c.length?c:ground)}
  else{const c=spotsFor(w,id).filter(t=>t&&!busy.has(t));if(!c.length)return null;target=a.home?pick(c):nearPick(w,c)}

// 町の中の場所は、近いところ（上位3つ）から選ぶ
function nearPick(w,c){const p=w.tile.pos,lv=w.tile.level,d=t=>Math.abs(t.pos[0]-p[0])+Math.abs(t.pos[1]-p[1])+Math.abs(t.level-lv)*4;return pick(c.slice().sort((a,b)=>d(a)-d(b)).slice(0,3))}
// 仕事・学校の時間か（job.hours は時間帯のリスト、days:'weekday' なら土日は休み）
const onJob=w=>!!(w.job&&!(w.job.days==='weekday'&&isWeekend())&&inHours(clock.hour,w.job.hours));

const mealWindow=h=>(h>=6.3&&h<9)||(h>=11.5&&h<13.5)||(h>=17.5&&h<20);

function score(w,id){
  const a=ACTS[id],h=clock.hour,n=w.needs,hs=w.house;let s=0;
  if(id==='sleep'||id==='sit')return-99;
  if(a.staff&&!(w.job&&w.job.acts.includes(id)))return-99;
  if(a.days==='weekday'&&isWeekend())return-99;
  const duty=onJob(w);let adj=0;
  // 仕事・学校には始まる1時間前から向かってよい（町が広いので）
  const early=duty&&w.job.acts.includes(id)&&a.hours&&!inHours(h,a.hours)&&inHours((h+1)%24,a.hours);
  if(duty&&w.job.acts.includes(id)){if(a.hours&&!inHours(h,a.hours)&&!early)return-99;adj=6}
  else if(duty&&!['toilet','eat','snack'].includes(id))adj=-2.5;
  switch(id){
    case'toilet':s=n.bladder<.22?5:n.bladder<.45?1.1:-3;break;
    case'eat':s=hs.mealReady>clock.sim&&n.food<.85?2.6+(1-n.food)*2:-3;break;
    case'snack':s=n.food<.3?1.4+(.3-n.food)*5:(n.food<.55&&Math.random()<.15?.6:-2);break;
    case'cook':s=!w.kid&&mealWindow(h)&&hs.mealReady<clock.sim&&!hs.cooking&&hs.residents.some(o=>o.needs.food<.7)?3.2:-3;break;
    case'dishes':s=hs.dirty&&!w.kid?1.4:-3;break;
    case'brush':{const morning=h>=w.wake&&h<w.wake+2,night=h>=w.sleep-1.2&&h<w.sleep;s=(morning||night)&&clock.sim-w.brushedAt>3*HR?2.6:-3;break}
    case'wash':s=h>=w.wake&&h<w.wake+1.2&&clock.sim-w.washedAt>6*HR?2:-3;break;
    case'bath':s=(h>=17.5||h<1)&&n.hygiene<.65?1.7+(1-n.hygiene)*1.6:n.hygiene<.18?1.6:-2;break;
    case'tv':s=(h>=18?.8:-.1)+(1-n.fun)*.9;break;
    case'rest':s=(1-n.energy)*1.2-.3+(weather.kind!=='clear'?.4:0);break;
    default:{
      if(a.gen){if(a.hours&&!inHours(h,a.hours)&&!early)return-99;if((a.who==='kid'&&!w.kid)||(a.who==='adult'&&w.kid))return-99}
      for(const k in a.gain){const g=a.gain[k];s+=g>0?g*(1-n[k])*2.4:g*(1-n[k])*1.4}
      if(id==='dance')s+=clock.sim<weather.festUntil||(directiveOn(w)&&w.directive.goal==='dance')?1.2:-99;
      if(id==='field'&&(h<6||h>17))s-=2;
      if(id==='fish'&&h>=14&&h<17)s+=.2;
      if(id==='nap')s+=h>=12&&h<15?.35:-.25;
      if(id==='stall'){if(w.keeper)s+=h>=8&&h<18?1.1:-2;else{const k=people.find(o=>o.keeper);s+=k&&k.act&&k.act.id==='stall'?.4:-.4}}
      if(id==='play'&&!w.kid)s-=.8;
      if((h>=19.5||h<5.5)&&!(id==='dance'&&clock.sim<weather.festUntil))s-=2.2;
      if(!a.inside&&weather.kind==='rain')s-=w.kid?.5:1.7;
      if(!a.inside&&weather.kind==='snow')s+=w.kid?.4:-.6;
      if(directiveOn(w)&&w.directive.goal==='home')s-=4;
      if(a.created!=null)s+=Math.max(0,1.6-(clock.sim-a.created)/(10*HR));
    }
  }
  s+=(w.likes[id]||0);
  if(id===w.lastAct&&id!=='eat')s-=.6;
  if(directiveOn(w)){if(w.directive.goal===id)s+=6;else if(w.directive.goal==='home'&&a.indoor)s+=.8;else s-=.3}
  return s+adj+Math.random()*.4;
}

function chatPartner(w){
  let best=null,bs=-1;
  people.forEach(o=>{if(o===w||o.player||sleepTime(o)||o.forced||directiveOn(o)||o.tile.stop||o.link)return;
    if((o.act&&(o.act.id==='chat'||(ACTS[o.act.id]&&ACTS[o.act.id].indoor)))||(o.goal&&o.goal.id==='chat'))return;
    if(o.keeper&&o.act&&o.act.id==='stall')return;if(o.tile.indoor!==w.tile.indoor&&Math.random()<.5)return;
    const s=w.rel[o.name]+(1-o.needs.social)*.6+Math.random()*.3;if(s>bs){bs=s;best=o}});
  return best;
}
function startChat(w){
  const o=chatPartner(w);if(!o)return false;
  const busy=taken(w),mx=(w.tile.pos[0]+o.tile.pos[0])/2,my=(w.tile.pos[1]+o.tile.pos[1])/2;
  const sameHouse=w.tile.bld&&w.tile.bld===o.tile.bld&&w.tile.level===o.tile.level;
  const pool=(sameHouse?w.tile.bld.floorTiles[w.tile.level].filter(t=>!t.stop):ground).filter(t=>!busy.has(t));
  const cand=pool.sort((a,b)=>Math.hypot(a.pos[0]-mx,a.pos[1]-my)-Math.hypot(b.pos[0]-mx,b.pos[1]-my));
  for(const t of cand.slice(0,30)){const nb=t.links.map(l=>l.to).find(n=>!n.stop&&n.bld===t.bld&&n.level===t.level&&!busy.has(n));if(!nb)continue;
    const g1={id:'chat',dur:ACTS.chat.dur,partner:o,lead:true},g2={id:'chat',dur:ACTS.chat.dur,partner:w};
    if(!setPlan(w,{goal:g1,target:t}))return false;o.forced={goal:g2,target:nb};return true}
  return false;
}
function bedtime(w){
  if(w.needs.bladder<.6&&setPlan(w,planAct(w,'toilet')))return true;
  if(clock.sim-w.brushedAt>4*HR&&setPlan(w,planAct(w,'brush')))return true;
  return false;
}
// その人がしてよい行動か（子ども向け・大人向け・店員や先生だけの行動）
const canDo=(w,id)=>{const a=ACTS[id];return!!a&&!(a.who==='kid'&&!w.kid)&&!(a.who==='adult'&&w.kid)&&!(a.staff&&!(w.job&&w.job.acts.includes(id)))};
// 遠くへ出かける前に、トイレが近ければ先にすませる
function tripPrep(w){
  if(w.path.length<18||w.needs.bladder>.6||!w.goal||w.goal.id==='toilet')return;
  const p=planAct(w,'toilet');if(!p)return;const keep={path:w.path,goal:w.goal,target:w.target};
  if(!setPlan(w,p)||w.path.length>8){w.path=keep.path;w.goal=keep.goal;w.target=keep.target}
}
function chooseGoal(w){
  if(w.kind==='cat')return catGoal(w);
  if(sleepTime(w)||(directiveOn(w)&&w.directive.goal==='sleep')){if(bedtime(w))return;if(setPlan(w,planAct(w,'sleep')))return;w.wait=.2*HR;return}
  const ranked=ACT_IDS.map(id=>[id,score(w,id)]).sort((a,b)=>b[1]-a[1]);
  for(const[id,s]of ranked){if(s<-50)break;
    if(id==='chat'){if(startChat(w))return;continue}
    if(setPlan(w,planAct(w,id))){tripPrep(w);return}
  }
  w.wait=.3*HR;
}
function catGoal(w){
  const h=clock.hour,night=h>=21||h<6,hs=homes(),hA=hs[0];
  if(night){const t=(hA.spots.rest||[]).find(t=>!taken(w).has(t))||pick(hA.floor);setPlan(w,{goal:{id:'catsleep',dur:[2,4]},target:t});return}
  if(weather.kind==='rain'){setPlan(w,{goal:{id:'cat',dur:[.5,1]},target:pick(hA.floor)});return}
  const pool=Math.random()<.25?pick(hs).floor:ground;
  setPlan(w,{goal:{id:'cat',dur:[.3,1]},target:pick(pool)});
}

function startAct(w,g){
  w.act=g;
  const a=ACTS[g.id];
  if(g.id==='sleep'){const left=((w.wake-clock.hour)%24+24)%24;w.wait=(directiveOn(w)&&w.directive.goal==='sleep'?Math.max(.3,(w.directive.until-clock.sim)/HR):Math.max(.3,left))*HR;say(w,a.phrase(w),3);w.lastDir=[0,1];return}
  w.wait=rand(g.dur||[.3,.6])*HR;
  const hs=g.hs||w.house;if(!hs)return;
  if(g.id==='cook'){hs.cooking=w;hs.cookName=mealName()}
  if(g.id==='tv')hs.tvOn=true;
  if(g.id==='chat'&&g.partner){const d=[g.partner.tile.pos[0]-w.tile.pos[0],g.partner.tile.pos[1]-w.tile.pos[1]];if(d[0]||d[1])w.lastDir=[Math.sign(d[0]),Math.sign(d[1])];return}
  if(w.tile.furn&&w.tile.furn.face)w.lastDir=w.tile.furn.face;
  if(a&&a.phrase&&(w.player||Math.random()<.8)){houseMealCtx=hs;say(w,a.phrase(w));houseMealCtx=null}
  if(g.id==='brush')w.brushedAt=clock.sim;if(g.id==='wash')w.washedAt=clock.sim;
}
function finishAct(w,interrupted){
  const a=w.act;w.act=null;w.target=null;if(!a||!w.house)return;
  w.lastAct=a.id;const hs=a.hs||w.house;
  if(a.id==='sleep'){w.needs.energy=Math.max(w.needs.energy,.92);if(!interrupted)say(w,pick([J('おはよう！よく眠れた。','Good morning! I slept well.'),J('ふぁ〜、おはよう。','Yawn... good morning.')]));remember(w,'ぐっすり眠った')}
  if(a.id==='toilet'&&!interrupted&&Math.random()<.6)say(w,J('トイレを流して、手を洗おう。','Flush the toilet and wash your hands.'));
  if(a.id==='cook'){hs.cooking=null;if(!interrupted){hs.mealReady=clock.sim+2.5*HR;hs.mealName=hs.cookName;say(w,J(`${hs.mealName.ja}ができたよ！`,`${cap(hs.mealName.en)} is ready!`),5);log(J(`${w.name}が${hs.mealName.ja}を作った`,`${w.en} made ${hs.mealName.en}.`))}}
  if(a.id==='eat'){hs.dirty=true;remember(w,'ごはんを食べた');if(!interrupted&&Math.random()<.5)say(w,J('ごちそうさまでした。','Thank you for the meal. That was good.'))}

  if(a.id==='tv'&&!walkers.some(o=>o!==w&&o.act&&o.act.id==='tv'&&(o.act.hs||o.house)===hs))hs.tvOn=false;
  if(a.id==='bath'&&!interrupted)say(w,J('さっぱりした！','I feel so clean!'));
  if(a.id==='chat'&&a.partner){const p=a.partner;
    w.rel[p.name]=clamp((w.rel[p.name]||.4)+.05,0,1);
    if(a.lead){remember(w,`${p.name}とおしゃべりした`);remember(p,`${w.name}とおしゃべりした`);if(Math.random()<.5)log(J(`${w.name}と${p.name}がおしゃべりした`,`${w.en} and ${p.en} had a chat.`))}
    if(p.act&&p.act.id==='chat'&&p.act.partner===w&&p.wait>0)p.wait=Math.min(p.wait,.05)}
  if(a.id==='fish'&&Math.random()<.5){remember(w,'魚を釣った');say(w,pick([J('釣れた！','I caught one!'),J('大物だ！','It\'s a big one!')]))}
}
function applyForced(w){
  const f=w.forced;w.forced=null;
  if(w.act)finishAct(w,true);
  w.act=null;w.wait=0;w.path=[];w.goal=null;w.target=null;
  if(!setPlan(w,f)){if(w.tile===f.target){w.goal=f.goal;w.target=f.target}}
}
function updateWalker(w,sdt){
  const dtH=sdt/HR,n=w.needs;
  if(n){
    const asleep=w.act&&w.act.id==='sleep'&&!w.link;
    n.energy+=(asleep?.14:-.045)*dtH;n.food-=(asleep?.015:.055)*dtH;n.social-=(asleep?.005:.05)*dtH;n.fun-=(asleep?0:.05)*dtH;n.bladder-=(asleep?.03:.11)*dtH;n.hygiene-=(asleep?.01:.035)*dtH;
    if(w.act&&!w.link&&w.wait>0){const g=ACTS[w.act.id]&&ACTS[w.act.id].gain;if(g)for(const k in g)n[k]+=g[k]*dtH}
    for(const k in n)n[k]=clamp(n[k],0,1);
    if(n.bladder<.06&&!w.player&&!(w.act&&w.act.id==='toilet')&&!(w.goal&&w.goal.id==='toilet')&&!w.link&&!w.forced){const p=planAct(w,'toilet');if(p){w.forced=p;say(w,J('もれちゃう〜！','I really need to go!'))}}
  }
  if(w.player){playerTick(w,sdt);return}
  if(w.link){const run=w.goal&&w.goal.run;w.phase+=(run?13:9)*sdt;w.t+=sdt*w.speed*WALK*(run?1.7:1);if(w.t>=1){const extra=w.t-1;w.lastDir=w.link.dir;w.tile=w.link.to;w.link=null;w.t=0;
    // 余った分はそのまま次のマスへ（早送りでも歩く速さが変わらないように）
    if(extra>0&&w.path.length&&!w.forced){const Lk=w.tile.links.find(l=>l.to===w.path[0]);if(Lk){w.path.shift();w.link=Lk;w.t=Math.min(extra,.99);return}}}else return}
  if(w.forced){applyForced(w);return}

  if(w.path.length){const nx=w.path.shift(),Lk=w.tile.links.find(l=>l.to===nx);if(!Lk){w.path=[];w.goal=null;w.target=null;return}w.link=Lk;w.t=0;return}
  if(w.goal){const g=w.goal;w.goal=null;startAct(w,g);return}
  w.act=null;w.target=null;

}

// 今いる場所の英語の説明（Claude への説明文用）
function placeOf(w){const t=w.tile;if(!t.indoor)return'outside';const b=t.bld,rc=t.room&&b.roomCenters[t.room];
  return(b===w.house?'at home':'in the '+b.spec.name_en)+(b.floors>1?`, floor ${t.level+1}`:'')+(rc?', in the '+rc.name.en:'')}

const corner=(lo,hi,h)=>[h&1?hi[0]:lo[0],h&2?hi[1]:lo[1],h&4?hi[2]:lo[2]];
function prepBox(b){
  b.skip=false;b.cut=false;let hi=b.hi,lo=b.lo;const h=b.bld;
  if(h&&h.k<1){lo=[b.lo[0],b.lo[1],b.lo[2]*h.k];hi=[b.hi[0],b.hi[1],Math.max(lo[2]+.01,b.hi[2]*h.k)]}
  if(b.exteriorOnly&&interior){b.skip=true;return}
  // 外観では建物の中身（家具・仕切り・階段）は見えないので描かない。床板は外から縁が見えるので残す
  if(!interior&&b.indoor&&h&&h.enterable&&b.deco.top!=='floor'){b.skip=true;return}
  // 内観では、見ている階より上は描かず、見ている階の手前の壁だけ低く切る
  const ef=interior&&h&&h.enterable?effFloor(h):-1;
  if(ef>=0&&b.level>ef){b.skip=true;return}
  // 上の階を見ている時、下の階の中身は床にかくれるので描かない（壁と床板は外から見えるので残す）

// Claude Artifact では host の `sample` を使う。それ以外（GitHub Pages など）では、

const API_KEY_STORE='hakoniwa-api-key',API_MODEL_STORE='hakoniwa-api-model';
const API_MODELS=[['claude-opus-5-5','Claude Opus 5.5'],['claude-sonnet-5-5','Claude Sonnet 5.5'],['claude-haiku-5-5','Claude Haiku 5.5']];
const FALLBACK_MODELS=new Set(['claude-opus-5-5','claude-sonnet-5-5']);

const lsGet=k=>{try{return localStorage.getItem(k)||''}catch(e){return''}};
const lsSet=(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k);return true}catch(e){return false}};
const apiKey=()=>lsGet(API_KEY_STORE).trim();
const apiModel=()=>{const m=lsGet(API_MODEL_STORE);return API_MODELS.some(([id])=>id===m)?m:API_MODELS[0][0]};
const apiErr=(code,message)=>Object.assign(new Error(message),{code});

// 返答テキストから JSON を取り出す（コードフェンスや前後の文章があっても読む）
function parseJSONText(t){
  const s=String(t).replace(/```(?:json)?/gi,'').trim();
  try{return JSON.parse(s)}catch(e){}
  const a=s.search(/[\[{]/),b=Math.max(s.lastIndexOf('}'),s.lastIndexOf(']'));
  if(a>=0&&b>a)try{return JSON.parse(s.slice(a,b+1))}catch(e){}
  throw apiErr('bad_json','Claude の返答を JSON として読めませんでした');
}

async function apiCall(prompt,opts={}){
  const key=apiKey();if(!key)throw apiErr('not_granted','API キーが未設定です');
  const model=apiModel();
  const body={model,max_tokens:16000,
    system:'Reply with exactly one JSON value and nothing else: no prose, no code fences.',
    messages:[{role:'user',content:String(prompt)}],
    output_config:{effort:opts.modelTier==='quick'?'low':'medium'}};
  const headers={'content-type':'application/json','x-api-key':key,'anthropic-version':'2026-10-21',
    'anthropic-dangerous-direct-browser-access':'true'};
  if(FALLBACK_MODELS.has(model)){body.fallbacks='default';headers['anthropic-beta']='server-side-fallback-2026-07-01'}
  let res;
  try{res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers,body:JSON.stringify(body),signal:opts.signal})}
  catch(e){throw apiErr('network','Claude API に接続できませんでした')}
  if(!res.ok){
    let msg='';try{msg=(await res.json()).error?.message||''}catch(e){}
    if(res.status===401||res.status===403){log(J('APIキーが使えません。「町」→ Claude API で確認してください','The API key was rejected. Check it under Town → Claude API.'));throw apiErr('not_granted',msg)}
    if(res.status===429||res.status===529)throw apiErr('rate_limited',msg);
    throw apiErr('api_error',`${res.status} ${msg}`);
  }
  const data=await res.json();
  if(data.stop_reason==='refusal')throw apiErr('refused','Claude が応答を控えました');
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
}

  walkers.forEach(w=>{if(hiddenW(w)||w===selected||(w.say&&S.time<w.say.until))return;if(w.act&&!w.link&&ACTS[w.act.id]&&ACTS[w.act.id].glyph&&w.act.id!=='chat'){const p=headPoint(w);bubble(p[0],p[1],ACTS[w.act.id].glyph,'glyph')}else if(w.act&&w.act.id==='catsleep'&&!w.link){const p=headPoint(w);bubble(p[0],p[1],'z','glyph')}});
  walkers.forEach(w=>{if(hiddenW(w)||!w.say||S.time>=w.say.until)return;const p=headPoint(w);bubble(p[0],p[1],w===selected?`${nameOf(w)}: ${sayText(w)}`:sayText(w),'say')});
  if(selected&&!hiddenW(selected)&&!(selected.say&&S.time<selected.say.until)){const p=headPoint(selected);bubble(p[0],p[1],nameOf(selected),'sel')}

}

// ================= generated buildings (voice of God) =================
// 神の声の建物は、町の建物と同じ設計図の形式（09-builder.js）で作る。Claude の返す設計図は信用せず、sanitizeSpec で必ず整える。
const MAX_GEN=24;
const genBuildings=()=>buildings.filter(b=>!b.fixed);
const toHex=c=>'#'+c.map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');
const str=(v,n)=>String(v??'').slice(0,n);
const num=(v,a,b,fb)=>{const x=Number(v);return isFinite(x)?clamp(x,a,b):fb};

const GAINS=['fun','energy','social','food','hygiene'];

function sanAct(a,i){

  const key=/^[a-z0-9_]{1,20}$/.test(String(a.key||''))?a.key:'a'+i;
  const rng=r=>Array.isArray(r)&&r.length===2?[num(r[0],0,24,0),num(r[1],0,24,24)]:null;
  let h=Array.isArray(a.hours)&&Array.isArray(a.hours[0])?a.hours.slice(0,4).map(rng).filter(Boolean):rng(a.hours);if(h&&!h.length)h=null;
  return{key,label_en:str(a.label_en,60),label_ja:str(a.label_ja||a.label_en,40),use_en:str(a.use_en||a.label_en,60),use_ja:str(a.use_ja||a.label_ja||a.label_en,40),

function sanParts(list,[w,d,zmax],max,lo0=0){

    out.push({shape:['box','prism','cylinder','cone'].includes(q.shape)?q.shape:'box',from:lo,to:hi,color:hexOut(q.color)||'#e6c8b4',top:hexOut(q.top),

// 設計図を検査して、組み立てられる形にそろえる（Claude の返答・保存データの読み込みの両方で使う）

  const out={v:2,name_en:str(sp.name_en,60)||'building',name_ja:str(sp.name_ja,40)||str(sp.name_en,40)||'建物',example_en:str(sp.example_en,100),example_ja:str(sp.example_ja,70),

  if(acts.length)out.activities=acts;else if(!enterable&&sp.activity){const a=sanAct(sp.activity,0);if(a)out.activity=a}

  out.uses=(Array.isArray(sp.uses)?sp.uses:[]).slice(0,6).filter(u=>u&&usable(u.act)&&Array.isArray(u.at)).map(u=>({act:u.act,at:u.at.slice(0,8).filter(c=>Array.isArray(c)).map(c=>[int(c[0],-1,w,0),int(c[1],-1,d,0)])}));
  if(!enterable){out.walkable=!!sp.walkable&&parts.every(q=>q.to[2]<=.12);return out}
  // ---- enterable building ----
  const st=sp.style||{};

  out.style={wall:hexOut(st.wall)||'#f6d6be',roof:hexOut(st.roof)||'#ec8c84',paper:hexOut(st.paper)||'#faf0e4',curtain:hexOut(st.curtain)||'#eca8a0',door:hexOut(st.door),
    roofShape:ROOF_SHAPES.includes(st.roofShape)?st.roofShape:'gable'};
  if(Array.isArray(st.chimney))out.style.chimney=cellIn(st.chimney,w,d);
  const dside=SIDES.includes(sp.door&&sp.door.side)?sp.door.side:'py',dlen=dside==='px'||dside==='nx'?d:w;
  out.door={side:dside,at:int(sp.door&&sp.door.at,0,dlen-1,Math.floor((dlen-1)/2))};
  if(sp.windows&&typeof sp.windows==='object'){out.windows={};for(const s of SIDES)if(Array.isArray(sp.windows[s])){const len=s==='px'||s==='nx'?d:w;out.windows[s]=sp.windows[s].slice(0,8).map(v=>num(v,.5,len-.5,len/2))}}

  out.rooms=(Array.isArray(sp.rooms)?sp.rooms:[]).slice(0,16).map((r,i)=>{const a=cellIn(r.from,w,d)||[0,0],b=cellIn(r.to,w,d)||[w-1,d-1];
    return{id:'r'+i,name_en:str(r.name_en,40)||'room',name_ja:str(r.name_ja,30)||str(r.name_en,30)||'部屋',floor:fl(r.floor),from:[Math.min(a[0],b[0]),Math.min(a[1],b[1])],to:[Math.max(a[0],b[0]),Math.max(a[1],b[1])],
      floorStyle:FLOOR_STYLES.includes(r.floorStyle)?r.floorStyle:'wood',color:hexOut(r.color)}});
  out.partitions=(Array.isArray(sp.partitions)?sp.partitions:[]).slice(0,30).map(p=>{if(!p)return null;
    if(p.y!=null&&Array.isArray(p.x)){const y=int(p.y,1,d-1,null);if(y==null)return null;const a=num(p.x[0],0,w,0),b=num(p.x[1],0,w,w);return b-a>=.5?{floor:fl(p.floor),y,x:[a,b]}:null}
    if(p.x!=null&&Array.isArray(p.y)){const x=int(p.x,1,w-1,null);if(x==null)return null;const a=num(p.y[0],0,d,0),b=num(p.y[1],0,d,d);return b-a>=.5?{floor:fl(p.floor),x,y:[a,b]}:null}

  out.stairs=[];
  if(floors>1)for(const s of(Array.isArray(sp.stairs)?sp.stairs:[]).slice(0,4)){const at=cellIn(s.at,w,d),dir=SIDES.includes(s.dir)?s.dir:'px',f=int(s.floor,0,floors-2,0);if(!at)continue;
    const v=FACE_VEC[dir],land=[at[0]+v[0],at[1]+v[1]];if(land[0]<0||land[1]<0||land[0]>=w||land[1]>=d)continue;
    const keys=[ck(at,f),ck(land,f),ck(at,f+1),ck(land,f+1)];if(keys.some(k=>used.has(k)))continue;keys.forEach(k=>used.add(k));out.stairs.push({at,dir,floor:f})}

  for(let f=0;f<floors-1;f++)if(!out.stairs.some(s=>s.floor===f)){
    for(const[at,dir]of[[[w-2,0],'px'],[[0,0],'px'],[[w-2,d-1],'px'],[[0,d-1],'px'],[[w-1,0],'py'],[[0,0],'py']]){const v=FACE_VEC[dir],land=[at[0]+v[0],at[1]+v[1]];if(land[0]>=w||land[1]>=d||at[0]<0)continue;
      const keys=[ck(at,f),ck(land,f),ck(at,f+1),ck(land,f+1)];if(keys.some(k=>used.has(k)))continue;keys.forEach(k=>used.add(k));out.stairs.push({at,dir,floor:f});break}}

    const o={type:it.type,at,floor:f,face:SIDES.includes(it.face)?it.face:'py'};const c=hexOut(it.color);if(c)o.color=c;const us=[].concat(it.use||[]).filter(usable).slice(0,3);if(us.length)o.use=us.length===1?us[0]:us;
    if(it.type==='custom'){o.parts=sanParts(it.parts,[.5,.5,2.4],12,-.5);if(!o.parts.length)continue;o.solid=!!it.solid;if(it.seat)o.seat=num(it.seat,.2,.9,.34);if(it.name_en){o.name_en=str(it.name_en,40);o.name_ja=str(it.name_ja,30)}}

// ---------- placement ----------
const doorOuter=(spec,x,y)=>{const[w,d]=spec.footprint,dr=spec.door||{side:'py',at:1},v=FACE_VEC[dr.side];
  const inner=dr.side==='px'?[w-1,dr.at]:dr.side==='nx'?[0,dr.at]:dr.side==='ny'?[dr.at,0]:[dr.at,d-1];return[x+inner[0]+v[0],y+inner[1]+v[1]]};
function canPlace(spec,cx,cy){
  const[w,d]=spec.footprint;
  for(let x=cx;x<cx+w;x++)for(let y=cy;y<cy+d;y++){const t=T(x,y);if(!t||t.tag!=='ground'||t.gen)return false}
  if(!spec.enterable&&spec.walkable)return true;
  // 道と広場の上には建てない
  for(let x=cx;x<cx+w;x++)for(let y=cy;y<cy+d;y++){const k=key(x,y);if(pathSet.has(k)||plazaSet.has(k))return false}
  const cells=new Set();for(let x=cx;x<cx+w;x++)for(let y=cy;y<cy+d;y++)cells.add(key(x,y));
  const start=townOrigin();if(!start||cells.has(key(start.pos[0],start.pos[1])))return false;
  const reach=skip=>{const seen=new Set([start]),q=[start];while(q.length){const o=q.shift();for(const l of o.links){const t=l.to;if(t.tag!=='ground'||seen.has(t)||(skip&&skip.has(key(t.pos[0],t.pos[1]))))continue;seen.add(t);q.push(t)}}return seen};
  const before=reach(null);let lost=0;before.forEach(t=>{if(cells.has(key(t.pos[0],t.pos[1])))lost++});
  const after=reach(cells);if(after.size!==before.size-lost)return false;
  if(spec.enterable){const dc=doorOuter(spec,cx,cy),t=T(...dc);if(!t||t.tag!=='ground'||cells.has(key(...dc))||!after.has(t))return false}
  return true;
}
function findSpot(spec){
  const[w,d]=spec.footprint,tgt=LANDMARKS[spec.near]||LANDMARKS.center,c=[];
  for(let x=0;x<=MW-w;x++)for(let y=0;y<=MH-d;y++){let pen=0;for(let i=x;i<x+w;i++)for(let j=y;j<y+d;j++){const k=key(i,j);if(pathSet.has(k)||plazaSet.has(k))pen+=spec.walkable?0:2.5}
    c.push({x,y,s:Math.hypot(x+(w-1)/2-tgt[0],y+(d-1)/2-tgt[1])+pen})}
  c.sort((a,b)=>a.s-b.s);
  for(const k of c)if(canPlace(spec,k.x,k.y))return k;
  return null;
}
function moveOff(o,cells,to){const inside=t=>t&&cells.has(key(t.pos[0],t.pos[1]));if(!inside(o.tile)&&!(o.link&&inside(o.link.to)))return;
  const nb=to||ground.find(g=>!cells.has(key(g.pos[0],g.pos[1]))&&Math.abs(g.pos[0]-o.tile.pos[0])+Math.abs(g.pos[1]-o.tile.pos[1])<=3)||ground[0];
  if(o.act)finishAct(o,true);o.link=null;o.tile=nb;if(o.player&&o.ppos)o.ppos=[nb.pos[0],nb.pos[1]];o.path=[];o.goal=null;o.target=null;o.act=null;o.wait=0}
const pathBroken=o=>o.path.length&&o.path.some(t=>T(t.pos[0],t.pos[1],t.level)!==t);
function placeBuilding(spec,pos,id,animate){
  const solidLot=spec.enterable||!spec.walkable,cells=new Set();
  for(const[x,y]of footCells(spec,pos))cells.add(key(x,y));
  if(solidLot){walkers.forEach(o=>moveOff(o,cells));for(const[x,y]of footCells(spec,pos)){const t=T(x,y);if(t)dropTile(t)}}
  const bld=buildBuilding(spec,pos,{id,animate});
  if(id){const n=Number(String(id).slice(1));if(n>=bldSeq)bldSeq=n+1}
  if(!solidLot)bld.cells.forEach(([x,y])=>{const t=T(x,y);if(t)t.gen=bld.id});
  relinkAround(bld.cells.concat(bld.door?[bld.door[1]]:[]));
  walkers.forEach(o=>{if(pathBroken(o)){o.path=[];o.goal=null;o.target=null}});
  buildings.forEach(refreshExtSpots);
  if(typeof addStructGL==='function'&&gl)addStructGL(bld);

const footCells=(spec,pos)=>{const out=[];for(let x=0;x<spec.footprint[0];x++)for(let y=0;y<spec.footprint[1];y++)out.push([pos.x+x,pos.y+y]);return out};
function removeBuilding(id){

  for(const p of bld.polys){const k=polys.indexOf(p);if(k>=0)polys.splice(k,1)}
  for(const v of bld.vocab){const k=VOCAB.indexOf(v);if(k>=0)VOCAB.splice(k,1)}
  for(const aid of bld.acts){walkers.forEach(o=>{if(o.act&&o.act.id===aid){o.act=null;o.wait=0}if(o.goal&&o.goal.id===aid){o.goal=null;o.path=[];o.target=null}});
    (SPOTS[aid]||[]).slice().forEach(t=>dropSpot(aid,t));delete SPOTS[aid];delete ACTS[aid];const ai=ACT_IDS.indexOf(aid);if(ai>=0)ACT_IDS.splice(ai,1)}
  for(const t of bld.extSpotTiles||[])for(const u of bld.extUses)dropSpot(u.aid,t);
  const cells=new Set(bld.cells.map(([x,y])=>key(x,y))),out=bld.door&&T(...bld.door[1]);
  walkers.forEach(o=>{if(o.tile.bld===bld||(o.link&&o.link.to.bld===bld)){const t=out||ground[0];if(o.act)finishAct(o,true);o.link=null;o.tile=t;if(o.player&&o.ppos)o.ppos=[t.pos[0],t.pos[1]];o.path=[];o.goal=null;o.target=null;o.act=null;o.wait=0}});

function saveBuilds(){try{localStorage.setItem('hakoniwa-builds',JSON.stringify(genBuildings().map(s=>({id:s.id,spec:s.spec,x:s.cx,y:s.cy,by:s.by,wish:s.wish}))))}catch(e){}}
function loadBuilds(){try{const a=JSON.parse(localStorage.getItem('hakoniwa-builds')||'[]');if(!Array.isArray(a))return;
  for(const r of a.slice(0,MAX_GEN)){const sp=r&&sanitizeSpec(r.spec);if(!sp||!canPlace(sp,r.x,r.y))continue;
    const st=placeBuilding(sp,{x:r.x,y:r.y},String(r.id),false);if(r.by){st.by=String(r.by).slice(0,20);st.wish=String(r.wish||'').slice(0,80)}}}catch(e){}}
function structSummary(){const g=genBuildings();return g.length?g.map(s=>`${s.id}: ${s.spec.name_en} (${s.spec.name_ja}) at (${s.cx},${s.cy})${s.enterable?`, ${s.floors} floor(s), enterable`:''}`).join('\n'):'(none)'}

// ---------- the design brief for Claude ----------
function buildPrompt(desc,voice,note,who){
  const furn=FURN_TYPES.map(k=>`${k} (${FURN[k].ja})`).join(', ');
  const pub=ACT_IDS.filter(k=>!ACTS[k].home&&!ACTS[k].gen&&!ACTS[k].random&&k!=='chat').join(', ');
  return `You design a structure for a cozy isometric town diorama (pastel, toy-like, like a dollhouse town). Anything is possible: a small object, a statue, or a full building people walk into (a school, a shop, a cafe, a library, a department store, a castle...).
Request from ${who||'the town god'}: "${voice}"
Design brief: ${desc}${note?`\n${note}`:''}

Scale: 1 unit = one grid cell. A person is about 1 unit tall. One storey is ${WALL_H} high, a door is about 1.1 high, a tree is about 1.6 tall.
The town is ${MW}x${MH} cells and mostly built up. Big buildings (6x5 to 7x10 cells) fit only on the vacant land in the east: use "near":"vacant" or "vacantNorth" for them.

Two kinds of design:
A) Object (statue, fountain, playground, tower, sign...): "enterable": false. Built only from "parts".
B) Building people enter: "enterable": true. Walls, windows, floors, door and roof are made for you. You lay out the inside.

Coordinates:
- "parts" use continuous local coordinates: x from 0 to footprint width, y from 0 to footprint depth, z up from 0. Front faces face +x and +y.
- Cells are integers [col,row] from [0,0] to [width-1,depth-1].
- "partitions" (low inner walls) lie on cell borders: {"floor":0,"x":3,"y":[0,4]} is a wall on the line x=3 from y=0 to y=4; {"floor":0,"y":2,"x":[0,5]} runs along y=2. Leave gaps so every room can be reached from the door.
Shapes for parts: "box" (axis-aligned), "prism" (gable roof filling its box, ridge along "axis" x or y), "cylinder" (12-sided, inscribed in its box), "cone" (inscribed in its box, apex at the top).
Patterns for box sides: none, windows, door, bricks, stripes, planks, tiles, glass, water, grass, dots. topPattern for box tops (water, grass, tiles...). "roof" adds roof lines to prisms.
Colors: soft pastels that fit peach walls (#f6d6be), coral roofs (#ec8c84), teal (#78aab4), mint (#b2e2ce), cream (#fcf0de), wood (#c69678), lavender stone (#b6a4d6). Bright accents are fine when asked for.

For an enterable building:
- "floors": 1-3. "style": {"wall":"#hex","roof":"#hex","paper":"#hex inner wall","curtain":"#hex","door":"#hex","roofShape":"gable|flat|tiered|none"}.
- "door": {"side":"py|px|nx|ny","at":cell index along that side}. py = the +y side (front). Keep the cell inside the door free.
- "rooms": [{"name_en","name_ja","floor":0,"from":[c,r],"to":[c,r],"floorStyle":"wood|tile|carpet|stone","color":"#hex"}] (floor look and room labels).
- "furniture": [{"type":..., "at":[c,r], "floor":0, "face":"py|px|nx|ny" (the side people use it from), "color":"#hex", "use": activity key}]. One item per cell. Types: ${furn}.

  try{
    const ev=growEvent();let plan=null,spec=null,usedAI=false;
    if(sample){try{const r=await sample.json(growPrompt(ev),{modelTier:'default',cache:false});if(r&&typeof r==='object')plan=r,usedAI=true}catch(err){const c=err&&err.code;if(c==='not_granted'||c==='sampling_disabled')sample=null;if(c==='rate_limited'){grow.lastAt=clock.sim-12*HR;return}}}
    if(plan){if(!['add','upgrade','none'].includes(plan.action))plan=null;else if(plan.action==='none'){grow.lastAt=clock.sim-9*HR;return}}
    if(!plan){plan=offlinePlan();if(!plan){grow.lastAt=clock.sim-9*HR;return}}
    const w=byName(String(plan.wisher||''))||pick(people.filter(p=>!p.player));
    const wish=plan.key?plan.wish:J(String(plan.wish_ja||plan.wish_en||'').slice(0,60)||'何か変えたいな。',String(plan.wish_en||plan.wish_ja||'').slice(0,90)||'I want something new.');
    grow.wishes[w.name]={ja:wish.ja,en:wish.en,day:clock.day};say(w,wish,7);
    const gen=growStructs().length;
    if(plan.action==='upgrade'){
      const st=genBuildings().find(s=>s.id===String(plan.target));
      if(st&&usedAI&&sample){
        let ns=null;try{ns=sanitizeSpec(await sample.json(revisePrompt(st,String(plan.brief||'').slice(0,300),wish.en),{modelTier:'default',cache:false}))}catch(err){}
        if(ns&&ns.footprint[0]===st.spec.footprint[0]&&ns.footprint[1]===st.spec.footprint[1]){
          const{cx,cy,id,by}=st,oldName=st.spec.name_ja;removeBuilding(id);ns.near=st.spec.near;const ns2=placeBuilding(ns,{x:cx,y:cy},id,true);ns2.by=by||w.name;ns2.wish=wish.ja;saveBuilds();
          finishGrowth(w,ns2,J(String(plan.log_ja||`${w.name}の願いで${oldName}が変わった`).slice(0,80),String(plan.log_en||`${w.en}'s wish changed the ${ns.name_en}.`).slice(0,100)),false);return}}
      plan.action='add'}
    if(plan.action==='add'){
      if(genBuildings().length>=MAX_GEN||gen>=14){grow.lastAt=clock.sim;return}
      if(plan.key)spec=smallSpec(plan.key);
      else if(sample&&usedAI){try{spec=sanitizeSpec(await sample.json(buildPrompt(String(plan.brief||'').slice(0,300),wish.en,'Keep it small: footprint at most 2x2 cells and 6-20 parts.','a villager'),{modelTier:'default',cache:false}))}catch(err){}}
      if(!spec){plan=offlinePlan();if(!plan)return;spec=smallSpec(plan.key)}
      if(spec&&(spec.enterable||spec.footprint[0]>2||spec.footprint[1]>2))spec=null;
      if(!spec){plan=offlinePlan();if(!plan)return;spec=smallSpec(plan.key)}
      const pos=findSpot(spec);if(!pos){grow.lastAt=clock.sim-6*HR;return}
      const st=placeBuilding(spec,pos,null,true);st.by=w.name;st.wish=wish.ja;saveBuilds();
      finishGrowth(w,st,J(String(plan.log_ja||`${w.name}の願いで${spec.name_ja}ができた`).slice(0,80),String(plan.log_en||`${w.en}'s wish came true: a ${spec.name_en}.`).slice(0,100)),true)}
  }catch(e){}finally{grow.busy=false}
}
function finishGrowth(w,st,msg,isNew){
  grow.lastAt=clock.sim;grow.log.push({day:clock.day,ja:msg.ja,en:msg.en});if(grow.log.length>40)grow.log.shift();
  log(msg,'god-line');remember(w,'願いがかなった');
  const thanks=pick([J('わあ、ありがとう！','Thank you so much!'),J('うれしい！','I\'m so happy!'),J('ずっとほしかったんだ。','I wanted this for so long.')]);
  setTimeout(()=>{say(w,thanks,5);if(st.acts[0]&&!w.tile.stop&&!w.player){const p=planAct(w,st.acts[0]);if(p)w.forced=p}},2500);
  people.filter(o=>o!==w&&!o.player&&!sleepTime(o)).sort(()=>Math.random()-.5).slice(0,2).forEach(o=>say(o,J(`${st.spec.name_ja}だ！いいね！`,`A ${st.spec.name_en}! Nice!`),4));
  saveTown(false);renderTown();
}
function growthCheck(){
  if(grow.busy)return;
  const h=clock.hour;if(h<8||h>20)return;
  const ev=growEvent();const gap=(ev==='festival'||ev==='rainbow')?7*HR:18*HR;
  if(clock.sim-grow.lastAt<gap||Math.random()<.35)return;
  growthStep();
}

loadBuilds();
let started=false;
// ================= boot =================
const _sv=readSave();if(_sv){restoreTown(_sv)}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;S.time+=dt;frame(dt);requestAnimationFrame(loop)}
resize();basis();tickClock();applyLang();if(_sv){log(TUI.resumed)}else log(J('1日目の朝。村の一日がはじまる','Day 1. A new day begins in the village.'));started=true;
if(TEST)TEST.api={cam,clock,walkers,S,boxes,tiles,buildings,SPOTS,ACTS,sep,sanitizeSpec,findSpot,placeBuilding,removeBuilding,offlineSpec,planAct,setPlan,setViewFloor,bfs,step(n,dt){for(let i=0;i<n;i++){S.time+=dt;frame(dt)}},
  setView(o){if('interior'in o){interior=o.interior;updateFloorBtn()}if('floor'in o)setViewFloor(o.floor);if('az'in o)cam.az=cam.taz=o.az;if('el'in o)cam.el=cam.tel=o.el;if('zoom'in o)cam.zoom=cam.tzoom=o.zoom;basis()}};
else requestAnimationFrame(loop);
})();
</script>
