<title>箱庭の村</title>
<style>
/* Layout: full-bleed canvas diorama; top HUD (clock, language, phrasebook, god's voice, villagers), bottom-left log/cards, bottom-right camera controls, side phrasebook */
:root{
  --ink:#4a3f5c;
  --ink-soft:#7a6d8f;
  --panel:rgba(255,253,250,.84);
  --line:rgba(120,100,160,.22);
  --accent:#e0786c;
  --gold:#c8902e;
  --en:#3f7fa8;
  --sky:#cfd9f0;
  --font:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--sky);color:var(--ink);font-family:var(--font);overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
.hud{position:fixed;z-index:2}
.panel{background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px}
.top{top:calc(env(safe-area-inset-top,0px) + 10px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.row1{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;pointer-events:none}
.row1>*{pointer-events:auto}
.clock{padding:6px 14px 7px;display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.clock .day{font-size:12px;color:var(--ink-soft);letter-spacing:.04em}
.clock b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock .period{font-size:13px;font-weight:700;color:var(--accent)}
.clock .wx{font-size:12px;color:var(--ink-soft)}
.pill{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:transparent}
.pill.lang{color:#fff;background:var(--en);border-color:transparent}
.pill .n{display:inline-block;min-width:1.4em;margin-left:4px;padding:0 5px;border-radius:8px;background:rgba(63,127,168,.15);color:var(--en);font-variant-numeric:tabular-nums}
.god{flex:1 1 300px;min-width:0;display:flex;align-items:center;gap:6px;padding:5px 5px 5px 12px}
.god label{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.06em;white-space:nowrap}
.god input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--ink);background:transparent;border:0;outline:0;padding:6px 2px}
.god input::placeholder{color:#a397b4}
.god button{font:inherit;font-size:13px;font-weight:700;color:#fff;background:var(--gold);border:0;border-radius:10px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.god button:disabled{opacity:.55;cursor:default}
.god:focus-within{box-shadow:0 0 0 2px rgba(200,144,46,.35)}
#roster{list-style:none;margin:0;padding:0 0 2px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;pointer-events:auto;align-self:flex-start;max-width:100%}
#roster::-webkit-scrollbar{display:none}
#roster button{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 5px;font:inherit;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;white-space:nowrap}
#roster button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px rgba(224,120,108,.25)}
.dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.hint{margin:0;font-size:11px;color:var(--ink-soft);pointer-events:none;align-self:flex-start;background:var(--panel);border-radius:8px;padding:2px 8px}
.log{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(440px,calc(100% - 340px));min-width:240px;padding:7px 12px;margin:0;list-style:none;font-size:12px;line-height:1.5;display:flex;flex-direction:column;gap:2px}
.log li{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log time{color:var(--ink-soft);font-variant-numeric:tabular-nums;margin-right:6px}
.log .sub{color:var(--ink-soft);margin-left:6px;font-size:11px}
.log .god-line{color:var(--gold);font-weight:700}
.sheet{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(350px,calc(100% - 32px));padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;max-height:calc(100% - 200px);overflow:auto}
@media (max-width:640px){
  .log{width:auto;right:max(16px,env(safe-area-inset-right,0px));min-width:0;bottom:calc(env(safe-area-inset-bottom,0px) + 58px)}
  .sheet{bottom:calc(env(safe-area-inset-bottom,0px) + 58px)}
}
.sheet header{display:flex;align-items:center;gap:8px}
.sheet h2{margin:0;font-size:17px}
.sheet .mood{font-size:12px;color:var(--ink-soft)}
.x{margin-left:auto;font:inherit;font-size:18px;line-height:1;color:var(--ink-soft);background:none;border:0;cursor:pointer;padding:4px 6px}
.persona{margin:0;font-size:12px;color:var(--ink-soft);line-height:1.5}
.status{margin:0;font-size:14px;font-weight:700;display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap}
.status .ja,.ja-sub{font-size:12px;font-weight:500;color:var(--ink-soft);display:block;width:100%}
.needs{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 8px;align-items:center;font-size:11px}
.bar{height:7px;border-radius:4px;background:rgba(120,100,160,.14);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{font:inherit;font-size:12px;font-weight:700;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer}
.acts button[aria-pressed="true"]{background:var(--ink);color:#fff}
.say-btn{font:inherit;font-size:12px;line-height:1;color:var(--en);background:rgba(63,127,168,.1);border:0;border-radius:8px;padding:5px 7px;cursor:pointer;flex:none}
.thought{margin:0;font-size:13px;line-height:1.6;background:rgba(200,144,46,.1);border-radius:10px;padding:8px 10px}
.word h2{font-size:22px;color:var(--en)}
.word .ex{margin:0;font-size:14px;line-height:1.55;font-weight:700}
.word .exja{margin:0;font-size:12px;color:var(--ink-soft)}
.book{top:calc(env(safe-area-inset-top,0px) + 10px);right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(360px,calc(100% - 32px));padding:12px 14px;display:flex;flex-direction:column;gap:8px;z-index:4}
.townbtns{display:flex;gap:6px;flex-wrap:wrap}
.apibox{display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:1px solid var(--line)}
.apibox h3{margin:0;font-size:14px}
#apiForm{display:flex;gap:6px;flex-wrap:wrap}
#apiForm input,#apiForm select{font:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-width:0}
#apiForm input{flex:1 1 10em}
#apiForm button:disabled{opacity:.5;cursor:default}
.persona.wish{color:var(--gold);font-weight:700}
.book header{display:flex;align-items:center;gap:8px}
.book h2{margin:0;font-size:16px}
.book p{margin:0;font-size:12px;color:var(--ink-soft);line-height:1.5}
.book ul{list-style:none;margin:0;padding:0;overflow:auto;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
.book li{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;background:#fff;border:1px solid var(--line);border-radius:10px}
.book li div{flex:1;min-width:0}
.book li b{display:block;font-size:13px;line-height:1.45}
.book li span{display:block;font-size:11px;color:var(--ink-soft);line-height:1.45}
.controls{bottom:calc(env(safe-area-inset-bottom,0px) + 12px);right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.controls button{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;min-width:38px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#fpv{position:fixed;inset:0;z-index:1;background:#000}
#fpv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fpvCanvas{touch-action:none;cursor:grab}
#fpvOverlay{pointer-events:none}
body.fpv .log,body.fpv .controls,body.fpv .hint,body.fpv #card{display:none!important}
.acts button.play{background:var(--en);color:#fff;border-color:transparent}
.fpvhud{z-index:3;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(640px,calc(100% - 32px));padding:10px 12px;display:flex;flex-direction:column;gap:8px}
body.coarse .fpvhud{left:auto;right:max(16px,env(safe-area-inset-right,0px));transform:none;width:calc(100% - 184px)}
.fpvtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.fneeds{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.mini{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--ink-soft)}
.mini em{font-style:normal}
.mini .bar{width:30px;height:6px}
.fsub{margin:0;font-size:15px;line-height:1.45}
.fsub b{display:block}
.fsub span{display:block;font-size:12px;color:var(--ink-soft)}
.facts{display:flex;gap:6px;flex-wrap:wrap}
.facts:empty{display:none}
.facts button{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.facts button.main{background:var(--en);color:#fff;border-color:transparent}
.facts button.on{background:var(--ink);color:#fff;border-color:transparent}
kbd{font:inherit;font-size:10px;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.14)}
.fctl{display:flex;gap:6px;align-items:center}
.fhint{flex:1;min-width:0;font-size:11px;color:var(--ink-soft)}
.fctl button{font:inherit;font-size:12px;font-weight:700;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.joy{display:none;position:fixed;z-index:3;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.6);touch-action:none}
body.fpv.coarse .joy{display:block}
.joy span{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.85);transform:translate(-50%,-50%);pointer-events:none}
.talk{z-index:3;top:calc(env(safe-area-inset-top,0px) + 118px);right:max(16px,env(safe-area-inset-right,0px));width:min(380px,calc(100% - 32px));max-height:calc(100% - 330px);min-height:220px;padding:12px;display:flex;flex-direction:column;gap:8px}
.talk header{display:flex;align-items:center;gap:8px}.talk h2{margin:0;font-size:16px}
#tList{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
#tList li{max-width:88%;padding:7px 10px;border-radius:12px;font-size:13px;line-height:1.45;background:#fff;border:1px solid var(--line);align-self:flex-start}
#tList li.me{align-self:flex-end;background:rgba(63,127,168,.12);border-color:transparent}
#tList li b{display:block;font-weight:700}
#tList li span{display:block;font-size:11px;color:var(--ink-soft)}
#tList .tip{margin-top:4px;font-size:11px;color:var(--gold);font-weight:700}
#tList .say-btn{margin-top:4px}
.chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.chips button{font:inherit;font-size:11px;white-space:nowrap;color:var(--en);background:rgba(63,127,168,.1);border:0;border-radius:999px;padding:5px 9px;cursor:pointer}
#tForm{display:flex;gap:6px}
#tForm input{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
#tForm button{font:inherit;font-size:13px;font-weight:700;color:#fff;background:var(--en);border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
.toast{position:fixed;z-index:6;left:50%;top:42%;transform:translate(-50%,-50%);background:rgba(40,34,56,.86);color:#fff;font-size:13px;padding:8px 14px;border-radius:10px;pointer-events:none}
.word{z-index:4}
</style>


<canvas id="scene" aria-label="住人たちが暮らす小さな箱庭の村"></canvas>
<div class="hud top" id="hudTop">
  <div class="row1">
    <div class="clock panel"><span class="day" id="day">1日目</span><b id="time">07:00</b><span class="period" id="period">朝</span><span class="wx" id="wx">晴れ</span></div>
    <button class="pill lang" id="langBtn" type="button">English</button>
    <button class="pill" id="labelBtn" type="button" aria-pressed="false" hidden>Labels: Off</button>
    <button class="pill" id="townBtn" type="button">町</button>
    <button class="pill" id="bookBtn" type="button"><span id="bookLbl">フレーズ帳</span><span class="n" id="bookN">0</span></button>
    <form class="god panel" id="godForm" autocomplete="off">
      <label for="godInput" id="godLbl">神の声</label>
      <input id="godInput" maxlength="140" placeholder="例：今日はお祭りだ！みんな広場に集まれ">
      <button id="godSend" type="submit">告げる</button>
    </form>
  </div>
  <ul id="roster"></ul>
  <p class="hint" id="hint">ドラッグで回転・ホイールで拡大・住人や物をタップ</p>
</div>
<ul class="hud log panel" id="log"></ul>
<section class="hud sheet panel" id="card" hidden>
  <header><span class="dot" id="cDot"></span><h2 id="cName"></h2><span class="mood" id="cMood"></span><button class="x" id="cClose" type="button" aria-label="閉じる">×</button></header>
  <p class="persona" id="cPersona"></p>
  <p class="persona wish" id="cWish" hidden></p>
  <p class="status"><span id="cStatus"></span><button class="say-btn" id="cSay" type="button" aria-label="Listen">🔊</button><span class="ja" id="cStatusJa"></span></p>
  <div class="needs" id="cNeeds"></div>
  <div class="acts"><button id="cThink" type="button">心の声を聞く</button><button id="cFollow" type="button" aria-pressed="false">この人を追う</button><button id="cPlay" class="play" type="button">この人になる（一人称）</button></div>
  <p class="thought" id="cThought" hidden></p>
</section>
<section class="hud sheet panel word" id="wordCard" hidden>
  <header><h2 id="wWord"></h2><button class="say-btn" id="wSay" type="button" aria-label="Listen">🔊</button><button class="x" id="wClose" type="button" aria-label="閉じる">×</button></header>
  <p class="exja" id="wJa"></p>
  <p class="ex" id="wEx"></p>
  <p class="exja" id="wExJa"></p>
  <div class="acts"><button id="wExSay" type="button">🔊 例文を聞く</button></div>
</section>
<section class="hud book panel" id="town" hidden>
  <header><h2 id="townTitle">町の保存と歩み</h2><button class="x" id="townClose" type="button" aria-label="閉じる">×</button></header>
  <p id="townNote"></p>
  <div class="townbtns"><button class="pill" id="townSave" type="button"></button><button class="pill" id="townReset" type="button"></button></div>
  <p id="townStamp"></p>
  <div class="apibox" id="apiBox" hidden>
    <h3 id="apiTitle">Claude API</h3>
    <p id="apiNote"></p>
    <form id="apiForm" autocomplete="off">
      <input id="apiKey" type="password" autocomplete="off" spellcheck="false" aria-label="API key">
      <select id="apiModel" aria-label="Model"></select>
      <button class="pill" id="apiSave" type="submit"></button>
      <button class="pill" id="apiClear" type="button"></button>
    </form>
    <p id="apiState"></p>
  </div>
  <ul id="townList"></ul>
</section>
<section class="hud book panel" id="book" hidden>
  <header><h2 id="bookTitle">フレーズ帳</h2><button class="x" id="bookClose" type="button" aria-label="閉じる">×</button></header>
  <p id="bookNote">村で聞こえた英語のフレーズがたまっていきます。🔊で発音を聞けます。</p>
  <ul id="bookList"></ul>
</section>
<div class="hud controls" id="controls">
  <button id="zoomOut" type="button" aria-label="縮小">－</button>
  <button id="zoomIn" type="button" aria-label="拡大">＋</button>
  <button id="roofBtn" type="button">外観を見る</button>
  <button id="speed" type="button">早送り ×1</button>
  <button id="reset" type="button">視点を戻す</button>
</div>

<div id="fpv" hidden><canvas id="fpvOverlay"></canvas></div>
<section class="hud fpvhud panel" id="fpvHud" hidden>
  <div class="fpvtop"><span class="dot" id="fpvDot"></span><b id="fpvName"></b><div class="fneeds" id="fpvNeeds"></div></div>
  <p class="fsub" id="fpvSub" hidden></p>
  <div class="facts" id="fpvActs"></div>
  <div class="fctl"><span class="fhint" id="fpvHint"></span><button id="fpvSpeed" type="button">×1</button><button id="fpvExit" type="button">戻る</button></div>
</section>
<div class="joy" id="joy"><span id="joyKnob"></span></div>
<section class="hud talk panel" id="talk" hidden>
  <header><span class="dot" id="tDot"></span><h2 id="tName"></h2><button class="x" id="tClose" type="button" aria-label="閉じる">×</button></header>
  <ul id="tList"></ul>
  <div class="chips" id="tChips"></div>
  <form id="tForm" autocomplete="off"><input id="tInput" maxlength="160" aria-label="message"><button id="tSend" type="submit">送る</button></form>
</section>
<div class="toast" id="toast" hidden></div>


<script>
(() => {
// ================= math =================
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ISO_AZ=Math.PI/4, ISO_EL=Math.asin(1/Math.sqrt(3));
const cross=(t,e)=>[t[1]*e[2]-t[2]*e[1],t[2]*e[0]-t[0]*e[2],t[0]*e[1]-t[1]*e[0]];
const dot=(t,e)=>t[0]*e[0]+t[1]*e[1]+t[2]*e[2];
const smooth=t=>{const e=clamp(t,0,1);return e*e*(3-2*e)};
const mix=(t,e,l)=>[lerp(t[0],e[0],l),lerp(t[1],e[1],l),lerp(t[2],e[2],l)];
const hash=t=>{const e=43758.5453*Math.sin(127.1*t+311.7);return e-Math.floor(e)};
const hx=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];
const rand=([a,b])=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const FONT='"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif';

// ================= language =================
let L='ja',showLabels=false;
try{showLabels=localStorage.getItem('hakoniwa-labels')==='1'}catch(e){}
try{const s=localStorage.getItem('hakoniwa-lang');if(s==='en'||s==='ja')L=s}catch(e){}
const tr=o=>o==null?'':typeof o==='string'?o:(o[L]??o.ja??o.en??'');
const J=(ja,en)=>({ja,en});
const UI={
  god:J('神の声','Voice of God'),send:J('告げる','Speak'),sending:J('届けています…','Sending…'),
  ph:J('例：今日はお祭りだ！みんな広場に集まれ','e.g. "It\'s festival day! Everyone, come to the plaza!"'),
  lang:J('English','日本語'),book:J('フレーズ帳','Phrasebook'),
  bookNote:J('村で聞こえた英語のフレーズがたまっていきます。🔊で発音を聞けます。','English phrases you hear in the village are saved here. Tap 🔊 to listen.'),
  bookEmpty:J('まだフレーズがありません。英語モードで住人の会話を聞いてみましょう。','No phrases yet. Watch the villagers in English mode.'),
  hint:J('ドラッグで回転・ホイールで拡大・住人や物をタップ','Drag to rotate · zoom in to see names · tap people and things to learn words'),
  think:J('心の声を聞く','Inner voice'),follow:J('この人を追う','Follow'),listening:J('耳をすましています…','Listening…'),
  roofOn:J('外観を見る','Show roofs'),roofOff:J('家の中を見る','Show inside'),
  speed:J('早送り','Speed'),play:J('この人になる（一人称）','Play as this person'),reset:J('視点を戻す','Reset view'),exSay:J('🔊 例文を聞く','🔊 Example')};

function bfs(a,b){if(a===b)return[];const prev=new Map([[a,null]]),q=[a];while(q.length){const o=q.shift();if(o===b){const p=[];let c=b;while(c!==a){p.unshift(c);c=prev.get(c)}return p}if(o.stop&&o!==a)continue;for(const l of o.links)if(!prev.has(l.to)){prev.set(l.to,o);q.push(l.to)}}return null}
const directiveOn=w=>w.directive&&clock.sim<w.directive.until;
const sleepTime=w=>{const h=clock.hour;const s=h>=w.sleep||h<w.wake;return s&&!(directiveOn(w)&&w.directive.goal!=='sleep'&&w.directive.goal!=='home')};
const taken=w=>{const s=new Set();walkers.forEach(o=>{if(o===w)return;if(o.target)s.add(o.target);s.add(o.link?o.link.to:o.tile)});return s};
const remember=(w,txt)=>{if(!w.memory)return;w.memory.push(`${hhmm(clock.hour)} ${txt}`);if(w.memory.length>8)w.memory.shift()};

function spotsFor(w,id){
  const h=w.house;
  switch(id){
    case'sleep':return[h.spots.beds[w.bed]];case'toilet':return h.spots.toilet;case'bath':return h.spots.tub;case'brush':case'wash':return h.spots.basin;
    case'cook':return h.spots.stove;case'eat':return h.spots.chairs;case'snack':return h.spots.fridge;case'dishes':return h.spots.sink;
    case'tv':case'rest':return h.spots.sofa;case'stall':return w.keeper?SPOTS.keeper:SPOTS.stall;case'dance':return SPOTS.plaza;
    default:return SPOTS[id]||[]}
}
function planAct(w,id){
  const a=ACTS[id];if(!a)return null;
  const goal={id,dur:a.dur,run:a.run};
  const busy=taken(w);let target;
  if(a.random){const here=w.tile.pos,c=ground.filter(t=>!busy.has(t)&&Math.abs(t.pos[0]-here[0])+Math.abs(t.pos[1]-here[1])<(a.run?7:10));target=pick(c.length?c:ground)}
  else{const c=spotsFor(w,id).filter(t=>t&&!busy.has(t));if(!c.length)return null;target=pick(c)}
  return{goal,target};
}
function setPlan(w,p){if(!p)return false;const path=bfs(w.tile,p.target);if(!path)return false;w.path=path;w.goal=p.goal;w.target=p.target;return true}
const mealWindow=h=>(h>=6.3&&h<9)||(h>=11.5&&h<13.5)||(h>=17.5&&h<20);

function score(w,id){
  const a=ACTS[id],h=clock.hour,n=w.needs,hs=w.house;let s=0;
  if(id==='sleep'||id==='sit')return-99;
  switch(id){
    case'toilet':s=n.bladder<.22?5:n.bladder<.45?1.1:-3;break;
    case'eat':s=hs.mealReady>clock.sim&&n.food<.85?2.6+(1-n.food)*2:-3;break;
    case'snack':s=n.food<.3?1.4+(.3-n.food)*5:(n.food<.55&&Math.random()<.15?.6:-2);break;
    case'cook':s=!w.kid&&mealWindow(h)&&hs.mealReady<clock.sim&&!hs.cooking&&hs.residents.some(o=>o.needs.food<.7)?3.2:-3;break;
    case'dishes':s=hs.dirty&&!w.kid?1.4:-3;break;
    case'brush':{const morning=h>=w.wake&&h<w.wake+2,night=h>=w.sleep-1.2&&h<w.sleep;s=(morning||night)&&clock.sim-w.brushedAt>3*HR?2.6:-3;break}
    case'wash':s=h>=w.wake&&h<w.wake+1.2&&clock.sim-w.washedAt>6*HR?2:-3;break;
    case'bath':s=(h>=17.5||h<1)&&n.hygiene<.65?1.7+(1-n.hygiene)*1.6:n.hygiene<.18?1.6:-2;break;
    case'tv':s=(h>=18?.8:-.1)+(1-n.fun)*.9;break;
    case'rest':s=(1-n.energy)*1.2-.3+(weather.kind!=='clear'?.4:0);break;
    default:{for(const k in a.gain){const g=a.gain[k];s+=g>0?g*(1-n[k])*2.4:g*(1-n[k])*1.4}
      if(id==='dance')s+=clock.sim<weather.festUntil||(directiveOn(w)&&w.directive.goal==='dance')?1.2:-99;
      if(id==='field'&&(h<6||h>17))s-=2;
      if(id==='fish'&&h>=14&&h<17)s+=.2;
      if(id==='nap')s+=h>=12&&h<15?.35:-.25;
      if(id==='stall'){if(w.keeper)s+=h>=8&&h<18?1.1:-2;else{const k=people.find(o=>o.keeper);s+=k&&k.act&&k.act.id==='stall'?.4:-.4}}
      if(id==='play'&&!w.kid)s-=.8;
      if((h>=19.5||h<5.5)&&!(id==='dance'&&clock.sim<weather.festUntil))s-=2.2;
      if(weather.kind==='rain')s-=w.kid?.5:1.7;
      if(weather.kind==='snow')s+=w.kid?.4:-.6;
      if(directiveOn(w)&&w.directive.goal==='home')s-=4;
      if(a.created!=null)s+=Math.max(0,1.6-(clock.sim-a.created)/(10*HR));
    }
  }
  s+=(w.likes[id]||0);
  if(id===w.lastAct&&id!=='eat')s-=.6;
  if(directiveOn(w)){if(w.directive.goal===id)s+=6;else if(w.directive.goal==='home'&&a.indoor)s+=.8;else s-=.3}
  return s+Math.random()*.4;
}

function chatPartner(w){
  let best=null,bs=-1;
  people.forEach(o=>{if(o===w||o.player||sleepTime(o)||o.forced||directiveOn(o)||o.tile.stop||o.link)return;
    if((o.act&&(o.act.id==='chat'||(ACTS[o.act.id]&&ACTS[o.act.id].indoor)))||(o.goal&&o.goal.id==='chat'))return;
    if(o.keeper&&o.act&&o.act.id==='stall')return;if(o.tile.indoor!==w.tile.indoor&&Math.random()<.5)return;
    const s=w.rel[o.name]+(1-o.needs.social)*.6+Math.random()*.3;if(s>bs){bs=s;best=o}});
  return best;
}
function startChat(w){
  const o=chatPartner(w);if(!o)return false;
  const busy=taken(w),mx=(w.tile.pos[0]+o.tile.pos[0])/2,my=(w.tile.pos[1]+o.tile.pos[1])/2;
  const sameHouse=w.tile.house&&w.tile.house===o.tile.house;
  const pool=(sameHouse?w.tile.house.spots.floor:ground).filter(t=>!busy.has(t));
  const cand=pool.sort((a,b)=>Math.hypot(a.pos[0]-mx,a.pos[1]-my)-Math.hypot(b.pos[0]-mx,b.pos[1]-my));
  for(const t of cand.slice(0,30)){const nb=t.links.map(l=>l.to).find(n=>!n.stop&&n.house===t.house&&!busy.has(n));if(!nb)continue;
    const g1={id:'chat',dur:ACTS.chat.dur,partner:o,lead:true},g2={id:'chat',dur:ACTS.chat.dur,partner:w};
    if(!setPlan(w,{goal:g1,target:t}))return false;o.forced={goal:g2,target:nb};return true}
  return false;
}
function bedtime(w){
  if(w.needs.bladder<.6&&setPlan(w,planAct(w,'toilet')))return true;
  if(clock.sim-w.brushedAt>4*HR&&setPlan(w,planAct(w,'brush')))return true;
  return false;
}
function chooseGoal(w){
  if(w.kind==='cat')return catGoal(w);
  if(sleepTime(w)||(directiveOn(w)&&w.directive.goal==='sleep')){if(bedtime(w))return;if(setPlan(w,planAct(w,'sleep')))return;w.wait=.2*HR;return}
  const ranked=ACT_IDS.map(id=>[id,score(w,id)]).sort((a,b)=>b[1]-a[1]);
  for(const[id,s]of ranked){if(s<-50)break;
    if(id==='chat'){if(startChat(w))return;continue}
    if(setPlan(w,planAct(w,id)))return;
  }
  w.wait=.3*HR;
}
function catGoal(w){

function updateWalker(w,sdt){

    if(w.act&&!w.link&&w.wait>0){const g=ACTS[w.act.id]&&ACTS[w.act.id].gain;if(g)for(const k in g)n[k]+=g[k]*dtH}

  if(w.forced){applyForced(w);return}

  w.act=null;w.target=null;

}

// Claude Artifact では host の `sample` を使う。それ以外（GitHub Pages など）では、
// 利用者が入力した API キーで api.anthropic.com を直接呼ぶ。キーは localStorage にだけ保存する。
const API_KEY_STORE='hakoniwa-api-key',API_MODEL_STORE='hakoniwa-api-model';
const API_MODELS=[['claude-opus-5-5','Claude Opus 5.5'],['claude-sonnet-5-5','Claude Sonnet 5.5'],['claude-haiku-5-5','Claude Haiku 5.5']];
const FALLBACK_MODELS=new Set(['claude-opus-5-5','claude-sonnet-5-5']);
let hostSample=null;
const lsGet=k=>{try{return localStorage.getItem(k)||''}catch(e){return''}};
const lsSet=(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k);return true}catch(e){return false}};
const apiKey=()=>lsGet(API_KEY_STORE).trim();
const apiModel=()=>{const m=lsGet(API_MODEL_STORE);return API_MODELS.some(([id])=>id===m)?m:API_MODELS[0][0]};
const apiErr=(code,message)=>Object.assign(new Error(message),{code});

// 返答テキストから JSON を取り出す（コードフェンスや前後の文章があっても読む）
function parseJSONText(t){
  const s=String(t).replace(/```(?:json)?/gi,'').trim();
  try{return JSON.parse(s)}catch(e){}
  const a=s.search(/[\[{]/),b=Math.max(s.lastIndexOf('}'),s.lastIndexOf(']'));
  if(a>=0&&b>a)try{return JSON.parse(s.slice(a,b+1))}catch(e){}
  throw apiErr('bad_json','Claude の返答を JSON として読めませんでした');
}

async function apiCall(prompt,opts={}){
  const key=apiKey();if(!key)throw apiErr('not_granted','API キーが未設定です');
  const model=apiModel();
  const body={model,max_tokens:16000,
    system:'Reply with exactly one JSON value and nothing else: no prose, no code fences.',
    messages:[{role:'user',content:String(prompt)}],
    output_config:{effort:opts.modelTier==='quick'?'low':'medium'}};
  const headers={'content-type':'application/json','x-api-key':key,'anthropic-version':'2026-10-21',
    'anthropic-dangerous-direct-browser-access':'true'};
  if(FALLBACK_MODELS.has(model)){body.fallbacks='default';headers['anthropic-beta']='server-side-fallback-2026-07-01'}
  let res;
  try{res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers,body:JSON.stringify(body),signal:opts.signal})}
  catch(e){throw apiErr('network','Claude API に接続できませんでした')}
  if(!res.ok){
    let msg='';try{msg=(await res.json()).error?.message||''}catch(e){}
    if(res.status===401||res.status===403){log(J('APIキーが使えません。「町」→ Claude API で確認してください','The API key was rejected. Check it under Town → Claude API.'));throw apiErr('not_granted',msg)}
    if(res.status===429||res.status===529)throw apiErr('rate_limited',msg);
    throw apiErr('api_error',`${res.status} ${msg}`);
  }
  const data=await res.json();
  if(data.stop_reason==='refusal')throw apiErr('refused','Claude が応答を控えました');
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
}
// host の sample と同じ形（sample.json(prompt, opts)）にそろえる
const apiSample=()=>apiKey()?{json:async(p,o)=>parseJSONText(await apiCall(p,o))}:null;

function findTile(p){if(!Array.isArray(p))return null;return tiles.find(t=>Math.abs(t.pos[0]-p[0])<.01&&Math.abs(t.pos[1]-p[1])<.01&&Math.abs(t.pos[2]-p[2])<.01&&t.links.length&&(t.indoor||tileAt.get(key(t.pos[0],t.pos[1]))===t))||null}
function restoreTown(s){
  clock.sim=Math.max(0,Number(s.sim)||0);tickClock();clock.lastDay=clock.day;clock.lastHourInt=Math.floor(clock.hour);
  const wx=s.weather||{};weather.kind=['clear','rain','snow'].includes(wx.kind)?wx.kind:'clear';weather.until=clock.sim+(Number(wx.left)||0);weather.festUntil=clock.sim+(Number(wx.fest)||0);weather.rainbowUntil=clock.sim+(Number(wx.rb)||0);weather.plan=null;
  (s.walkers||[]).forEach(r=>{const w=byName(String(r.n));if(!w)return;
    const t=findTile(r.pos);if(t){w.tile=t;w.link=null;w.path=[];w.goal=null;w.target=null;w.act=null;w.forced=null;w.wait=.05*HR;w.t=0}
    if(w.needs&&r.needs)for(const k in w.needs){const v=Number(r.needs[k]);if(isFinite(v))w.needs[k]=clamp(v,0,1)}
    if(w.rel&&r.rel)for(const k in w.rel){const v=Number(r.rel[k]);if(isFinite(v))w.rel[k]=clamp(v,0,1)}
    if(Array.isArray(r.mem)&&w.memory)w.memory=r.mem.map(String).slice(-8);
    if(r.mood&&MOODS.includes(r.mood)){w.mood=r.mood;w.moodUntil=clock.sim+(Number(r.moodLeft)||0)}});
  const g=s.growth||{};grow.log=Array.isArray(g.log)?g.log.filter(x=>x&&x.ja&&x.en).map(x=>({day:Number(x.day)||1,ja:String(x.ja).slice(0,90),en:String(x.en).slice(0,110)})):[];
  grow.lastAt=clock.sim-(Number(g.since)||0);grow.wishes=g.wishes&&typeof g.wishes==='object'?g.wishes:{};
  lastSaveAt=Number(s.at)||0;
}
function renderTown(){
  renderApiPanel();
  if(!$('town'))return;

  const t=lastSaveAt?new Date(lastSaveAt):null;$('townStamp').textContent=saveErr?tr(TUI.fail):t?`${tr(TUI.last)}: ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`:'';
  const ul=$('townList');ul.replaceChildren();

  grow.log.slice().reverse().forEach(e=>{const li=document.createElement('li'),d=document.createElement('div'),b=document.createElement('b'),s=document.createElement('span');
    b.textContent=L==='en'?e.en:e.ja;s.textContent=(L==='en'?`Day ${e.day}`:`${e.day}日目`)+(L==='en'?'  '+e.ja:'  '+e.en);d.append(b,s);li.append(d);ul.append(li)})
}

setInterval(()=>{if(!window.__noSave)saveTown(false)},10000);
addEventListener('pagehide',()=>{if(!window.__noSave)saveTown(false)});

// ---- growth: villagers' wishes and events slowly change the town
const SMALLS={

    parts:[{shape:'cylinder',from:[.45,.45,0],to:[.55,.55,1.2],color:'#8a7a9a'},{shape:'box',from:[.3,.3,1.2],to:[.7,.7,1.55],color:'#ffe39a',pattern:'windows'},{shape:'cone',from:[.25,.25,1.55],to:[.75,.75,1.8],color:'#ec8c84'}],act:null},

    parts:[{shape:'box',from:[.05,.1,0],to:[1.95,.9,.25],color:'#c69678',top:'#8cc795',topPattern:'grass'},{shape:'box',from:[.3,.3,.25],to:[.5,.5,.45],color:'#f2a0b8'},{shape:'box',from:[.85,.5,.25],to:[1.05,.7,.45],color:'#ffe39a'},{shape:'box',from:[1.4,.3,.25],to:[1.6,.5,.45],color:'#c9b3ee'}],
    act:{label_en:'enjoying the flowers',label_ja:'花をながめる',use_en:'Enjoy the flowers',use_ja:'花をながめる',phrase_en:'They smell so nice.',phrase_ja:'いい香りだね。',gain:{fun:.25,energy:.1}}},

    parts:[{shape:'box',from:[.1,.2,0],to:[1.9,.7,.35],color:'#c69678',pattern:'planks'},{shape:'box',from:[.1,.65,.35],to:[1.9,.75,.85],color:'#c69678',pattern:'planks'},{shape:'box',from:[.4,.25,.35],to:[.6,.55,.5],color:'#78aab4'}],
    act:{label_en:'reading a book',label_ja:'本を読む',use_en:'Read a book',use_ja:'本を読む',phrase_en:'This story is great.',phrase_ja:'この話、おもしろいな。',gain:{fun:.3,energy:.15}}},
  scarecrow:{name_en:'scarecrow',name_ja:'かかし',footprint:[1,1],near:'field',wish:J('畑を守るかかしがほしい。','I want a scarecrow to guard the field.'),ex:['The scarecrow protects the crops.','かかしが作物を守るよ。'],
    parts:[{shape:'box',from:[.45,.45,0],to:[.55,.55,1.3],color:'#c69678'},{shape:'box',from:[.1,.45,.9],to:[.9,.55,1],color:'#c69678'},{shape:'cylinder',from:[.35,.35,1.3],to:[.65,.65,1.6],color:'#fcf0de'},{shape:'cone',from:[.25,.25,1.6],to:[.75,.75,1.95],color:'#e8c070'}],act:null},
  picnic:{name_en:'picnic table',name_ja:'ピクニックテーブル',footprint:[2,2],near:'plaza',wish:J('みんなで外ごはんを食べたいな。','I want to eat outside with everyone.'),ex:['Let\'s have lunch at the picnic table.','ピクニックテーブルでお昼にしよう。'],
    parts:[{shape:'box',from:[.2,.6,.45],to:[1.8,1.4,.55],color:'#c69678',pattern:'planks'},{shape:'box',from:[.3,.7,0],to:[.4,.8,.45],color:'#a97d62'},{shape:'box',from:[1.6,.7,0],to:[1.7,.8,.45],color:'#a97d62'},{shape:'box',from:[.3,1.2,0],to:[.4,1.3,.45],color:'#a97d62'},{shape:'box',from:[1.6,1.2,0],to:[1.7,1.3,.45],color:'#a97d62'},{shape:'box',from:[.2,.1,0],to:[1.8,.5,.3],color:'#c69678',pattern:'planks'},{shape:'box',from:[.2,1.5,0],to:[1.8,1.9,.3],color:'#c69678',pattern:'planks'}],
    act:{label_en:'having a picnic',label_ja:'ピクニックをする',use_en:'Have a picnic',use_ja:'ピクニックをする',phrase_en:'Eating outside is the best!',phrase_ja:'外で食べるのは最高！',gain:{food:.35,social:.4,fun:.15}}},
  birdbath:{name_en:'bird bath',name_ja:'水のみ場',footprint:[1,1],near:'center',wish:J('小鳥が遊びに来るといいな。','I hope little birds come to visit.'),ex:['Look! A bird at the bird bath.','見て！水のみ場に小鳥がいるよ。'],
    parts:[{shape:'cylinder',from:[.3,.3,0],to:[.7,.7,.5],color:'#b6a4d6'},{shape:'cylinder',from:[.1,.1,.5],to:[.9,.9,.62],color:'#b6a4d6',top:'#88c2e2',topPattern:'water'}],
    act:{label_en:'watching the birds',label_ja:'小鳥を見る',use_en:'Watch the birds',use_ja:'小鳥を見る',phrase_en:'So cute!',phrase_ja:'かわいい！',gain:{fun:.25,energy:.1}}}
};
const growStructs=()=>structures.filter(s=>s.by);
function smallSpec(k){const d=SMALLS[k];return sanitizeSpec({name_en:d.name_en,name_ja:d.name_ja,example_en:d.ex[0],example_ja:d.ex[1],footprint:d.footprint,near:d.near,parts:d.parts,activity:d.act})}
function growEvent(){return clock.sim<weather.rainbowUntil?'rainbow':clock.sim<weather.festUntil?'festival':weather.kind==='rain'?'rain':weather.kind==='snow'?'snow':null}
function offlinePlan(){
  const cand=people.filter(w=>!w.player&&!sleepTime(w));if(!cand.length)return null;const ev=growEvent();
  const have=new Set(structures.map(s=>s.spec.name_en));let best=null,bs=-1;
  for(const w of cand){const n=w.needs;for(const k in SMALLS){if(have.has(SMALLS[k].name_en))continue;let s=Math.random()*.8;
    if(k==='swing')s+=(w.kid?2.5:0)+(w.likes.play||0)+(1-n.fun)*1.2;
    if(k==='lantern')s+=(ev==='festival'?2.2:0)+(clock.hour>16?.6:0);
    if(k==='flowerbed')s+=(w.likes.flower||0)*2+(ev==='rainbow'?1.8:0);
    if(k==='readnook')s+=(w.likes.bench||0)*2.2;
    if(k==='scarecrow')s+=(w.likes.field||0)*2.4;
    if(k==='picnic')s+=(1-n.social)*2+(1-n.food)*1.2+(ev==='festival'?1.2:0);
    if(k==='birdbath')s+=(w.likes.nap||0)+(w.likes.fish||0)*.8+(1-n.energy)*.6;
    if(s>bs){bs=s;best={k,w}}}}
  if(!best)return null;const d=SMALLS[best.k];
  return{action:'add',wisher:best.w.name,wish:d.wish,key:best.k,reason:ev};
}
function growPrompt(ev){
  const recent=logs.slice(-8).map(l=>`${l.t} ${l.p.en||tr(l.p)}`).join('\n')||'(quiet)';
  const wishes=people.map(w=>`- ${w.name} (${w.en}): likes ${Object.entries(w.likes).filter(([,v])=>v>.3).map(([k])=>k).join(', ')||'-'}; memories: ${(w.memory||[]).slice(-3).map(m=>m.replace(/^\d\d:\d\d /,'')).join(' / ')||'-'}${grow.wishes[w.name]?`; last wish: ${grow.wishes[w.name].en}`:''}`).join('\n');
  const made=structures.length?structures.map(s=>`${s.id}: ${s.spec.name_en}${s.by?` (made for ${s.by})`:''}`).join('\n'):'(none)';
  return `You are the gentle spirit of a cozy village diorama. The village grows slowly: small objects appear or change because villagers wish for them or because of what happened. Decide ONE small change right now, or none.

Now: day ${clock.day}, ${hhmm(clock.hour)}, weather ${weather.kind}${ev?`, event: ${ev}`:''}
Villagers:
${worldSummary()}
Their tastes and memories:
${wishes}
Recent happenings:
${recent}
Existing structures (id: name):
${made}
Landmarks: ${Object.keys(LANDMARKS).join(', ')}.

Rules: Keep changes small and charming (bench, swing, lamp, flower bed, scarecrow, sign, shrine, stall decoration, banner, garden furniture, a small pond ornament, mailbox...). Tie it to a real villager's wish, need, or the recent event, and do not repeat things that already exist. "add" = a new object (max 2x2 cells). "upgrade" = improve or redecorate one existing structure from the list (target = its id), e.g. new colors for the season, flowers, a lantern added, a bigger roof. Use "none" if nothing fits.
Reply with JSON only:
{"action":"add|upgrade|none","wisher":"ミノリ","wish_en":"I wish I had a quiet place to read.","wish_ja":"静かに本が読める場所がほしい。","brief":"English design brief: what, style, colors, size in cells (1-2), near which landmark","target":null,"log_en":"Minori's wish came true: a reading bench.","log_ja":"ミノリの願いで読書ベンチができた。"}`;
}
function specJSON(sp){return{name_en:sp.name_en,name_ja:sp.name_ja,example_en:sp.example_en,example_ja:sp.example_ja,footprint:sp.footprint,walkable:sp.walkable,near:sp.near,
  parts:sp.parts.map(q=>({shape:q.shape,from:q.lo.map(v=>+v.toFixed(2)),to:q.hi.map(v=>+v.toFixed(2)),color:toHex(q.color),top:q.top?toHex(q.top):undefined,pattern:q.pattern!=='none'?q.pattern:undefined,topPattern:q.topPattern!=='none'?q.topPattern:undefined,axis:q.axis})),activity:sp.activity}}
function revisePrompt(st,brief,wish){
  return buildPrompt(brief,wish,`This is an UPGRADE of an existing structure. Keep the same footprint ${st.spec.footprint.join('x')}, the same general identity and position, and make only a modest, charming change. Current design JSON:\n${JSON.stringify(specJSON(st.spec))}\nReturn the complete revised design in the same JSON format (all parts).`,'a villager');
}
async function growthStep(){
  if(grow.busy)return;grow.busy=true;
  try{
    const ev=growEvent();let plan=null,spec=null,usedAI=false;
    if(sample){try{const r=await sample.json(growPrompt(ev),{modelTier:'default',cache:false});if(r&&typeof r==='object')plan=r,usedAI=true}catch(err){const c=err&&err.code;if(c==='not_granted'||c==='sampling_disabled')sample=null;if(c==='rate_limited'){grow.lastAt=clock.sim-12*HR;return}}}
    if(plan){if(!['add','upgrade','none'].includes(plan.action))plan=null;else if(plan.action==='none'){grow.lastAt=clock.sim-9*HR;return}}
    if(!plan){plan=offlinePlan();if(!plan){grow.lastAt=clock.sim-9*HR;return}}
    const w=byName(String(plan.wisher||''))||pick(people.filter(p=>!p.player));
    const wish=plan.key?plan.wish:J(String(plan.wish_ja||plan.wish_en||'').slice(0,60)||'何か変えたいな。',String(plan.wish_en||plan.wish_ja||'').slice(0,90)||'I want something new.');
    grow.wishes[w.name]={ja:wish.ja,en:wish.en,day:clock.day};say(w,wish,7);
    const gen=growStructs().length;
    if(plan.action==='upgrade'){
      const st=structures.find(s=>s.id===String(plan.target));
      if(st&&usedAI&&sample){
        let ns=null;try{ns=sanitizeSpec(await sample.json(revisePrompt(st,String(plan.brief||'').slice(0,300),wish.en),{modelTier:'default',cache:false}))}catch(err){}
        if(ns&&ns.footprint[0]===st.spec.footprint[0]&&ns.footprint[1]===st.spec.footprint[1]){
          const{cx,cy,id,by}=st,oldName=st.spec.name_ja;removeStructure(id);ns.near=st.spec.near;const ns2=placeStructure(ns,{x:cx,y:cy},id,true);ns2.by=by||w.name;ns2.wish=wish.ja;saveBuilds();
          finishGrowth(w,ns2,J(String(plan.log_ja||`${w.name}の願いで${oldName}が変わった`).slice(0,80),String(plan.log_en||`${w.en}'s wish changed the ${ns.name_en}.`).slice(0,100)),false);return}}
      plan.action='add'}
    if(plan.action==='add'){
      if(structures.length>=24||gen>=14){grow.lastAt=clock.sim;return}
      if(plan.key)spec=smallSpec(plan.key);
      else if(sample&&usedAI){try{spec=sanitizeSpec(await sample.json(buildPrompt(String(plan.brief||'').slice(0,300),wish.en,'Keep it small: footprint at most 2x2 cells and 6-20 parts.','a villager'),{modelTier:'default',cache:false}))}catch(err){}}
      if(!spec){plan=offlinePlan();if(!plan)return;spec=smallSpec(plan.key)}
      if(spec.footprint[0]>2||spec.footprint[1]>2)spec.footprint=[Math.min(2,spec.footprint[0]),Math.min(2,spec.footprint[1])];
      const pos=findSpot(spec);if(!pos){grow.lastAt=clock.sim-6*HR;return}
      const st=placeStructure(spec,pos,null,true);st.by=w.name;st.wish=wish.ja;saveBuilds();
      finishGrowth(w,st,J(String(plan.log_ja||`${w.name}の願いで${spec.name_ja}ができた`).slice(0,80),String(plan.log_en||`${w.en}'s wish came true: a ${spec.name_en}.`).slice(0,100)),true)}
  }catch(e){}finally{grow.busy=false}
}
function finishGrowth(w,st,msg,isNew){
  grow.lastAt=clock.sim;grow.log.push({day:clock.day,ja:msg.ja,en:msg.en});if(grow.log.length>40)grow.log.shift();
  log(msg,'god-line');remember(w,'願いがかなった');
  const thanks=pick([J('わあ、ありがとう！','Thank you so much!'),J('うれしい！','I\'m so happy!'),J('ずっとほしかったんだ。','I wanted this for so long.')]);
  setTimeout(()=>{say(w,thanks,5);if(st.actId&&!w.tile.stop&&!w.player){const p=planAct(w,st.actId);if(p)w.forced=p}},2500);
  people.filter(o=>o!==w&&!o.player&&!sleepTime(o)).sort(()=>Math.random()-.5).slice(0,2).forEach(o=>say(o,J(`${st.spec.name_ja}だ！いいね！`,`A ${st.spec.name_en}! Nice!`),4));
  saveTown(false);renderTown();
}
function growthCheck(){
  if(grow.busy)return;
  const h=clock.hour;if(h<8||h>20)return;
  const ev=growEvent();const gap=(ev==='festival'||ev==='rainbow')?7*HR:18*HR;
  if(clock.sim-grow.lastAt<gap||Math.random()<.35)return;
  growthStep();
}

function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;S.time+=dt;frame(dt);requestAnimationFrame(loop)}
resize();basis();tickClock();applyLang();if(_sv){log(TUI.resumed)}else log(J('1日目の朝。村の一日がはじまる','Day 1. A new day begins in the village.'));started=true;
requestAnimationFrame(loop);
})();
