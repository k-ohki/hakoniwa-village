name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 秘密情報の検査で全履歴を見る
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # テスト専用。アプリ本体は外部パッケージに依存しない
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke && npm run sim && npm run test:build && npm run test:dialog
